# The MQTT broker for Home Assistant's MQTT integration and the plants service (~/plants), which announces each
# plant as a device here. Only reachable on home_default: no port is published.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
