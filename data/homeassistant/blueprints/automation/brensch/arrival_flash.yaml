blueprint:
  name: Arrival flash
  description: >
    When a person arrives home, blink the chosen lights a colour a few times,
    then leave them on in a warm cream colour.
  domain: automation
  input:
    arrival_tracker:
      name: Person device tracker
      description: The device_tracker whose arrival triggers the flash.
      selector:
        entity:
          filter:
            domain: device_tracker
    flash_lights:
      name: Lights to flash
      description: Light(s) or group(s) to blink and then leave on.
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    flash_color:
      name: Flash colour
      description: RGB colour to blink.
      selector:
        color_rgb: {}
    flash_count:
      name: Number of blinks
      default: 3
      selector:
        number:
          min: 1
          max: 10
    final_color:
      name: Final colour
      description: RGB colour to leave the lights on after the flash.
      default:
        - 255
        - 218
        - 176
      selector:
        color_rgb: {}
    final_brightness:
      name: Final brightness
      description: Brightness percentage to leave the lights on after the flash.
      default: 75
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    flash_lock:
      name: Arrival flash lock
      description: >
        A shared input_boolean used as a mutex. Give every arrival-flash
        automation the SAME helper so simultaneous arrivals run one-at-a-time
        and the flashes run one-at-a-time.
      selector:
        entity:
          filter:
            domain: input_boolean

mode: restart

variables:
  lights: !input flash_lights
  color: !input flash_color
  count: !input flash_count
  final_color: !input final_color
  final_brightness: !input final_brightness
  lock_entity: !input flash_lock

triggers:
  - trigger: zone
    entity_id: !input arrival_tracker
    zone: zone.home
    event: enter

conditions: []

actions:
  # 0. Serialize: wait for any in-progress arrival flash to fully finish
  #    (including its final turn-on), then claim the lock. Self-heals after 30s
  #    if a previous run left the lock stuck.
  - wait_template: "{{ is_state(lock_entity, 'off') }}"
    timeout: "00:00:30"
    continue_on_timeout: true
  - action: input_boolean.turn_on
    target:
      entity_id: !input flash_lock
  # 1. Blink the arrival colour.
  - repeat:
      count: "{{ count }}"
      sequence:
        - action: light.turn_on
          target:
            entity_id: !input flash_lights
          data:
            rgb_color: !input flash_color
            brightness_pct: 100
            transition: 0
        - delay:
            milliseconds: 400
        - action: light.turn_off
          target:
            entity_id: !input flash_lights
          data:
            transition: 0
        - delay:
            milliseconds: 300
  # 2. Leave the lights on in a warm cream colour.
  - action: light.turn_on
    target:
      entity_id: !input flash_lights
    data:
      rgb_color: !input final_color
      brightness_pct: !input final_brightness
      transition: 1
  # 3. Release the lock for the next arrival.
  - action: input_boolean.turn_off
    target:
      entity_id: !input flash_lock
