blueprint:
  name: Hue dimmer room control
  description: >
    One Hue dimmer switch controls a room's lights. Button 1 toggles the
    light group (smooth all-on / all-off, matching the dashboard tile);
    the up/down buttons step brightness on hold or short press. Uses the
    Hue button event entities so it works for any dimmer.
  domain: automation
  input:
    button_toggle:
      name: Toggle button (top / on)
      description: The button-1 event entity of the dimmer.
      selector:
        entity:
          filter:
            domain: event
            integration: hue
    button_up:
      name: Brighten button (up)
      description: The button-2 event entity of the dimmer.
      selector:
        entity:
          filter:
            domain: event
            integration: hue
    button_down:
      name: Dim button (down)
      description: The button-3 event entity of the dimmer.
      selector:
        entity:
          filter:
            domain: event
            integration: hue
    room_lights:
      name: Room lights
      description: The light (or light group) this dimmer controls.
      selector:
        target:
          entity:
            domain: light
    on_brightness_pct:
      name: Turn-on brightness
      description: >
        Brightness the toggle button turns the room on at. 0 keeps each
        light's remembered brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    step_pct:
      name: Brightness step
      description: Percent brightness change per up/down event.
      default: 15
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: '%'

mode: queued
max: 10
max_exceeded: silent

variables:
  step: !input step_pct
  on_brightness: !input on_brightness_pct
  room: !input room_lights

triggers:
  - trigger: state
    entity_id: !input button_toggle
    id: toggle
    not_to:
      - unavailable
      - unknown
  - trigger: state
    entity_id: !input button_up
    id: up
    not_to:
      - unavailable
      - unknown
  - trigger: state
    entity_id: !input button_down
    id: down
    not_to:
      - unavailable
      - unknown

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
        sequence:
          # Same as light.toggle on a group (any light on -> all off), but
          # turning on can force a brightness instead of the remembered one.
          - if:
              - condition: template
                value_template: >
                  {{ expand(room.entity_id) | selectattr('state', 'eq', 'on') | list | count > 0 }}
            then:
              - action: light.turn_off
                target: !input room_lights
            else:
              - if:
                  - condition: template
                    value_template: "{{ on_brightness | int > 0 }}"
                then:
                  - action: light.turn_on
                    target: !input room_lights
                    data:
                      brightness_pct: "{{ on_brightness | int }}"
                else:
                  - action: light.turn_on
                    target: !input room_lights
      - conditions:
          - condition: trigger
            id: up
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['repeat', 'short_release'] }}"
        sequence:
          - action: light.turn_on
            target: !input room_lights
            data:
              brightness_step_pct: "{{ step | int }}"
      - conditions:
          - condition: trigger
            id: down
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['repeat', 'short_release'] }}"
        sequence:
          - action: light.turn_on
            target: !input room_lights
            data:
              brightness_step_pct: "{{ step | int * -1 }}"
