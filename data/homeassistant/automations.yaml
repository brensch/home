- id: '1754677598257'
  alias: 'Turn off lights when we leave '
  description: When the last person leaves home, turn off the lights.
  # zone.home's state is how many people are home; 0 means the last of us left.
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    not_from:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id:
      - balcony
      - bedroom
      - closet
      - kitchen
      - living_room
  mode: single
- id: arrival_flash
  alias: Arrival flash
  description: Flash both Lines, the kitchen table light, Brightboy, the two TV lights and (before 9pm) the bedroom in the arriver's colour, then turn the living room on.
  # not_from keeps an HA restart (unknown/unavailable -> home) from flashing.
  triggers:
  - trigger: state
    entity_id: person.alyssa
    to: home
    not_from:
    - unknown
    - unavailable
    variables:
      color: [0, 255, 200]    # aqua
  - trigger: state
    entity_id: person.brend
    to: home
    not_from:
    - unknown
    - unavailable
    variables:
      color: [255, 110, 0]    # orange
  actions:
  # The bedroom joins before 9pm only, so a late arrival doesn't light up
  # someone already in bed. fan_front is the kitchen table light.
  - action: script.flash_lights
    data:
      lights: >
        {{ ['light.lines_kitchen', 'light.lines_desk',
            'light.fan_front',
            'light.brightboy1',
            'light.tv_left', 'light.tv_right']
           + (['light.bedroom'] if now().hour < 21 else []) }}
      color: '{{ color }}'
      hold: 5
  # Always, not just after dark: the house is dark even in the day.
  # No transition: HA's Nanoleaf integration treats a turn_on with a
  # transition but no brightness as "full brightness", which would push an
  # already-on Lines to 100%. Without one, lights that are on are left alone.
  - action: light.turn_on
    target:
      entity_id: light.living_room_all
  # flash_lights queues overlapping calls itself; parallel just hands them over.
  mode: parallel
- id: '1755761528874'
