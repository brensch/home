- id: downtime_report
  alias: Downtime report
  description: Stamp a heartbeat every 5 minutes; on startup after 10+ minutes down, say how long and what came back.
  triggers:
  - trigger: time_pattern
    minutes: /5
    id: beat
  - trigger: homeassistant
    event: start
    id: start
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      # Read the old heartbeat before anything overwrites it.
      - variables:
          last_seen: "{{ state_attr('input_datetime.server_heartbeat', 'timestamp') }}"
      - condition: "{{ last_seen is number and now().timestamp() - last_seen > 600 }}"
      # Give the plugs and lights a few minutes to reconnect before reporting.
      - delay: 00:03:00
      - action: notify.send_message
        target:
          entity_id:
          - notify.schlixel
          - notify.alyssas_iphone
        data:
          title: Home server was down
          message: >
            {% set mins = ((now().timestamp() - last_seen) / 60) | int %}
            {% set fridge = states('sensor.fridge_power') | float(0) %}
            {% set off = states.switch | selectattr('entity_id', 'search', '_relay$') | rejectattr('state', 'eq', 'on')
               | map(attribute='entity_id') | map('replace', 'switch.', '') | map('replace', '_relay', '') | list %}
            {% set dark = states.light | rejectattr('attributes.entity_id', 'defined') | selectattr('state', 'eq', 'unavailable')
               | map(attribute='name') | list %}
            Down {{ mins // 60 }}h {{ mins % 60 }}m, from {{ last_seen | timestamp_custom('%a %H:%M') }}.
            Fridge: {{ ('on, cooling (' ~ fridge | round(0) | int ~ ' W)' if fridge > 20 else 'on, between cooling cycles')
                       if is_state('switch.fridge_relay', 'on') else 'OFF!' }}.
            {{ 'Plugs off: ' ~ off | join(', ') ~ '.' if off else 'All plugs on.' }}
            {{ 'Lights offline: ' ~ dark | join(', ') ~ '.' if dark else '' }}
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.server_heartbeat
    data:
      timestamp: "{{ now().timestamp() }}"
  mode: single
- id: fridge_watchdog
  alias: Fridge watchdog
  description: 'Normal (10 days of 5 s samples, 2026-09-28..10-08): 45-105 min of cooling, 40-100 min off.
    A healthy cycle starts at ~103 W and settles to 88-91 W within 15 min (85-88 W by 30 min); only
    a post-defrost cycle stays above 95 W longer, 25-43 min. With the door open (2026-10-07 19:48, 3 h)
    it held 110 W flat, and on 2026-10-04 (11 h) 98 W flat, so sustained draw is the early signal:
    the old 4 h nonstop trigger fired 3 h after the door opened and an hour after we had noticed.
    2026-10-21 (door open after a defrost) it held 105-112 W from 19:14 and the 95 W rule only fired at
    20:29. Over 2026-10-08..26 (115 cycles, 4 defrosts) no healthy cycle stayed above 105 W for more than
    5 min (post-defrost ones included), so 105 W for 20 min fires ~55 min sooner; the 430 W defrost heater
    is excluded by the 200 W cap. That was the freezer door; a fridge door draws less (98 W on 10-04), and
    outside the cycle after a defrost no healthy cycle stayed above 95 W for more than 11 min (post-defrost:
    up to 40), so 95 W for 30 min, skipped for 3 h after a defrost (sensor.fridge_last_defrost), with the
    75 min rule still covering those hours.
    Warn when it stops cycling, draws hard for too long, runs nonstop, or its plug is off or offline.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.fridge_power
    below: 20
    for: 03:00:00
    variables:
      problem: hasn't run its compressor in 3 hours. Is it warm inside?
  - trigger: numeric_state
    entity_id: sensor.fridge_power
    above: 105
    below: 200
    for: 00:20:00
    variables:
      problem: >-
        has been pulling {{ states('sensor.fridge_power') | round(0) | int }} W for 20 minutes.
        A healthy cycle drops under 105 W within 5 minutes. Freezer door open?
  - trigger: numeric_state
    id: no_defrost
    entity_id: sensor.fridge_power
    above: 95
    below: 200
    for: 00:30:00
    variables:
      problem: >-
        has been pulling {{ states('sensor.fridge_power') | round(0) | int }} W for 30 minutes.
        A healthy cycle drops under 95 W within 15 minutes. Door open?
  - trigger: numeric_state
    entity_id: sensor.fridge_power
    above: 95
    for: 01:15:00
    variables:
      problem: >-
        has been pulling {{ states('sensor.fridge_power') | round(0) | int }} W for 75 minutes.
        A healthy cycle drops under 95 W within 15 minutes. Door open?
  - trigger: numeric_state
    entity_id: sensor.fridge_power
    above: 20
    for: 04:00:00
    variables:
      problem: has been cooling nonstop for 4 hours. Door left open?
  - trigger: state
    entity_id: switch.fridge_relay
    to: 'off'
    for: 00:01:00
    variables:
      problem: plug is switched OFF.
  - trigger: state
    entity_id: switch.fridge_relay
    to: unavailable
    for: 00:15:00
    variables:
      problem: plug has been offline for 15 minutes.
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.id != 'no_defrost' or now() - as_datetime(states('sensor.fridge_last_defrost'), now() - timedelta(days=1))
         > timedelta(hours=3) }}
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.schlixel
      - notify.alyssas_iphone
    data:
      title: Fridge
      message: The fridge {{ problem }}
  mode: queued
- id: weekly_battery_report
  alias: Weekly battery report
  description: Sunday morning, list device batteries under 30% (phones excluded).
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: time
    weekday: sun
  actions:
  - variables:
      lines: >
        {% set ns = namespace(low=[]) %}
        {% for s in states.sensor | selectattr('attributes.device_class', 'eq', 'battery')
           | rejectattr('entity_id', 'in', integration_entities('mobile_app')) | selectattr('state', 'is_number') %}
          {% if s.state | int < 30 %}{% set ns.low = ns.low + [(s.state | int, s.name | replace(' Battery', ''))] %}{% endif %}
        {% endfor %}
        {% for pct, name in ns.low | sort %}{{ name }}: {{ pct }}%{{ '\n' if not loop.last }}{% endfor %}
  - condition: "{{ lines | trim | length > 0 }}"
  - action: notify.send_message
    target:
      entity_id: notify.schlixel
    data:
      title: Batteries to replace
      message: "{{ lines | trim }}"
  mode: single
- id: wake_up_light
  alias: Wake-up light
  description: Fade the bedroom up over the 20 minutes before Brend's phone alarm.
  triggers:
  - trigger: time
    at:
      entity_id: sensor.schlixel_next_alarm
      offset: -00:20:00
  conditions:
  - condition: state
    entity_id: person.brend
    state: home
  # Only real clock alarms, not reminders other apps schedule.
  - condition: state
    entity_id: sensor.schlixel_next_alarm
    attribute: Package
    state: com.google.android.deskclock
  # Someone's already up with the lights on; leave them.
  - condition: state
    entity_id: light.bedroom
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 1
      color_temp_kelvin: 2732
      transition: 0
  # 2732 K is the Hue bulbs' own default white, the same as the rest of the house.
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 80
      color_temp_kelvin: 2732
      transition: 1200
  mode: single
- id: balcony_motion_light
  alias: Balcony motion light
  description: After dark, outdoor motion turns the balcony on until 3 minutes after motion stops. Leaves it alone if it was already on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_outdoor_motion_sensor_1_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: light.balcony
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.balcony
    data:
      brightness_pct: 100
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.hue_outdoor_motion_sensor_1_motion
      to: 'off'
      for: 00:03:00
    timeout: 01:00:00
  - action: light.turn_off
    target:
      entity_id: light.balcony
  mode: single
- id: tv_lights
  alias: TV lights
  description: Playing turns the Lines, Hektar and Brightboy off (always) and, after dark, dims the living room; finishing brings the living room back up.
  # media_player.tv_cast (Google Cast) reports playing/paused/buffering for
  # YouTube, Stremio and other Cast-based apps, including ones opened with the
  # remote. Seeking and skipping ads show as paused for 3-10 s, so pausing never
  # counts as finished. Finished is the app closed or the TV off (off/unavailable)
  # for 5 s, or nothing loaded (idle: the video ended, back at the app's menu)
  # for a minute, since idle gaps between episodes run 10-60 s.
  triggers:
  - trigger: state
    entity_id: media_player.tv_cast
    to: playing
    not_from:
    - unknown
    - unavailable
    id: playing
  - trigger: state
    entity_id: media_player.tv_cast
    to: idle
    for: 00:01:00
    id: stopped
  - trigger: template
    value_template: "{{ states('media_player.tv_cast') in ['off', 'unavailable', 'unknown', 'standby'] }}"
    for: 00:00:05
    id: stopped
  actions:
  - variables:
      dimmed: "{{ is_state('input_boolean.movie_dimmed', 'on') }}"
      room: >
        {{ (state_attr('light.living_room', 'entity_id') | list + ['light.lines_desk'])
           | select('has_value') | list }}
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      # Music (Spotify etc. over Cast) isn't a reason to change the lights.
      - "{{ state_attr('media_player.tv_cast', 'media_content_type') != 'music' }}"
      sequence:
      # After dark, save the living room's real look (on the devices, survives
      # restarts) before anything changes, so stopping can put it back.
      - if:
        - "{{ not dimmed }}"
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        - condition: state
          entity_id: light.living_room
          state: 'on'
        then:
        - action: shell_command.light_memory
          data:
            args: "save movie {{ room | join(' ') }}"
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.movie_dimmed
        - action: scene.turn_on
          target:
            entity_id: scene.living_room_dimmed
          data:
            transition: 2
      # Hektar and Brightboy off, every time (the numbered kitchen lights and
      # the table light stay on). They fade; the Lines just switch off,
      # because HA's Nanoleaf integration turns a transition-off into "forget
      # the brightness".
      - action: light.turn_off
        target:
          entity_id:
          - light.hektar
          - light.brightboy1
        data:
          transition: 5
      - action: light.turn_off
        target:
          entity_id:
          - light.lines_kitchen
          - light.lines_desk
    - conditions:
      - condition: trigger
        id: stopped
      - "{{ dimmed }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.movie_dimmed
      # If someone turned the living room off during the film, leave it off.
      - if:
        - condition: state
          entity_id: light.living_room
          state: 'on'
        then:
        - action: shell_command.light_memory
          data:
            args: restore movie --fade 1
  mode: queued
- id: balcony_person_alert
  alias: Person on the balcony
  description: >-
    Push to both phones (ours and Alyssa's) when Frigate sees a person on the balcony, with its snapshot; tapping it opens the Camera page.
    If Frigate then reads their face during the visit, the same notification is replaced with the face and, once
    the Face Library knows them, their name. At most one alert every 10 minutes (mode single, and the wait at the
    end keeps it busy), so one visit is one alert.
  triggers:
  - trigger: state
    entity_id: binary_sensor.balcony_person
    to: 'on'  # from off, or from unknown after a restart
  actions:
  # Frigate usually publishes the person's snapshot just before the person count (0.3 s on 2026-10-11); if this
  # visit's hasn't come yet, wait up to 5 s for it (or send without).
  - if: "{{ now() - states.image.balcony_last_person_snapshot.last_changed > timedelta(seconds=10) }}"
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: image.balcony_last_person_snapshot
      timeout: 00:00:05
  - variables:
      at: "{{ now().strftime('%-I:%M %p') }}"
      phones: [mobile_app_schlixel, mobile_app_alyssas_iphone_12_fall_2020]
  - repeat:
      for_each: "{{ phones }}"
      sequence:
      - action: notify.{{ repeat.item }}
        data:
          title: Person on the balcony
          message: Someone at {{ at }}
          data:
            image: /api/image_proxy/image.balcony_last_person_snapshot?t={{ now().timestamp() | int }}
            url: /camera-dash/camera  # iOS
            clickAction: /camera-dash/camera  # Android
            tag: balcony_person
  # A face, if one shows while they're there (sensor.balcony_last_face changes with each face Frigate reads).
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.balcony_last_face
    timeout: 00:02:00
  - if: "{{ wait.trigger is not none }}"
    then:
    - delay: 00:00:02  # let image.balcony_last_face fetch the new crop
    - variables:
        who: "{{ state_attr('sensor.balcony_last_face', 'name') | default('unknown', true) }}"
    - repeat:
        for_each: "{{ phones }}"
        sequence:
        - action: notify.{{ repeat.item }}
          data:
            title: Person on the balcony
            message: "{{ who | title if who != 'unknown' else 'Someone (face not known yet)' }} at {{ at }}"
            data:
              image: /api/image_proxy/image.balcony_last_face?t={{ now().timestamp() | int }}
              url: /camera-dash/camera
              clickAction: /camera-dash/camera
              tag: balcony_person
  - delay: 00:10:00
  mode: single
  max_exceeded: silent
- id: server_disk_space
  alias: Server disk space
  description: >-
    Warn when the server's root disk (133 GB) drops under 15% free (~20 GB) and again under 5% (~7 GB), and when the
    NVR volume (100 GB, /srv/nvr) drops under 5% free: Frigate deletes old footage itself well before that, so it
    would mean its cleanup has stopped. Repeats every morning while still low. Free space as a percentage comes
    from template sensors in configuration.yaml.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.server_disk_free_percent
    below: 15
    for: 00:05:00
  - trigger: numeric_state
    entity_id: sensor.server_disk_free_percent
    below: 5
    for: 00:05:00
  - trigger: numeric_state
    entity_id: sensor.nvr_disk_free_percent
    below: 5
    for: 00:15:00
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: >-
      {{ states('sensor.server_disk_free_percent') | float(100) < 15 or states('sensor.nvr_disk_free_percent') | float(100) < 5 }}
  actions:
  - variables:
      message: >-
        {% set free = states('sensor.server_disk_free_percent') | float(100) %}{% set nvr = states('sensor.nvr_disk_free_percent') | float(100) %}
        {% if free < 15 %}Server disk {{ free }}% free ({{ states('sensor.server_disk_free') }} GiB).{% if free < 5 %} Critical: services start failing when it fills.{% endif %}{% endif %}
        {% if nvr < 5 %} NVR volume only {{ nvr }}% free: Frigate should keep it above this; check that it's still cleaning up.{% endif %}
  - action: notify.send_message
    target:
      entity_id: notify.schlixel
    data:
      title: Server disk space
      message: "{{ message | trim }}"
  - action: persistent_notification.create
    data:
      notification_id: server_disk_space
      title: Server disk space
      message: "{{ message | trim }}"
  mode: single
- id: server_health
  alias: Server health
  description: >-
    Warn when the server itself is struggling: CPU over 90% for 15 minutes, memory over 90% used (not counting
    cache) or CPU package over 90 °C for 10 minutes. The readings are System Monitor's (sensor.server_*), which see
    the whole host from inside the container; this replaced schniffer's node-exporter (2026-10-14). Repeats every
    morning while still true.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.server_cpu_usage
    above: 90
    for: 00:15:00
  - trigger: numeric_state
    entity_id: sensor.server_memory_usage
    above: 90
    for: 00:10:00
  - trigger: numeric_state
    entity_id: sensor.server_cpu_temperature
    above: 90
    for: 00:10:00
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: >-
      {{ states('sensor.server_cpu_usage') | float(0) > 90 or states('sensor.server_memory_usage') | float(0) > 90
         or states('sensor.server_cpu_temperature') | float(0) > 90 }}
  actions:
  - variables:
      message: >-
        {% set cpu = states('sensor.server_cpu_usage') | float(0) %}{% set mem = states('sensor.server_memory_usage') | float(0) %}{% set t = states('sensor.server_cpu_temperature') | float(0) %}
        {% if cpu > 90 %}CPU {{ cpu }}% (load {{ states('sensor.server_load_15m') }}). {% endif %}
        {% if mem > 90 %}Memory {{ mem }}% used, swap {{ states('sensor.server_swap_usage') }}%. {% endif %}
        {% if t > 90 %}CPU at {{ t }} °C. {% endif %}Check `docker stats` for the container responsible.
  - action: notify.send_message
    target:
      entity_id: notify.schlixel
    data:
      title: Server health
      message: "{{ message | trim }}"
  - action: persistent_notification.create
    data:
      notification_id: server_health
      title: Server health
      message: "{{ message | trim }}"
  mode: single
- id: offsite_backup_stale
  alias: Off-box backup
  description: >-
    Warn when the daily backup to Google Drive (the "backup" container) hasn't succeeded for over 2 days, checked
    every morning after it should have run: a run that failed lists what failed; no status at all means the
    container isn't running.
  triggers:
  - trigger: time
    at: 07:30:00
  conditions:
  - condition: template
    value_template: >-
      {{ states('sensor.offsite_backup') in ['unknown', 'unavailable']
         or now() - as_datetime(states('sensor.offsite_backup')) > timedelta(days=2) }}
  actions:
  - variables:
      message: >-
        {% set f = state_attr('sensor.offsite_backup', 'failed') %}Google Drive backup hasn't succeeded since
        {{ states('sensor.offsite_backup') | as_datetime | as_local | default('ever', true) }}{{ '; failing: ' ~ f if f else '' }}.
        Check the backup container's log.
  - action: notify.send_message
    target:
      entity_id: notify.schlixel
    data:
      title: Backup
      message: "{{ message }}"
  - action: persistent_notification.create
    data:
      notification_id: offsite_backup
      title: Backup
      message: "{{ message }}"
  mode: single

- id: suckist_needs_help
  alias: Suckist needs help
  description: >-
    Tell both phones when the Roborock (Suckist) or its dock needs a person: the robot reports an error (stuck,
    brush tangled, ...), the dock reports one, the clean water tank is empty or the dirty one full. Each condition
    alerts once when it starts (after a minute, so passing blips don't), not again until it clears.
  triggers:
  - trigger: state
    entity_id: sensor.suckist_vacuum_error
    not_to: [none, unknown, unavailable]
    for: 00:01:00
    id: robot
  - trigger: state
    entity_id: sensor.suckist_dock_dock_error
    not_to: [ok, unknown, unavailable]
    for: 00:01:00
    id: dock
  - trigger: state
    entity_id: [binary_sensor.suckist_dock_clean_water_box, binary_sensor.suckist_water_shortage]
    from: "off"
    to: "on"
    for: 00:01:00
    id: clean_water
  - trigger: state
    entity_id: binary_sensor.suckist_dock_dirty_water_box
    from: "off"
    to: "on"
    for: 00:01:00
    id: dirty_water
  conditions: []
  actions:
  - variables:
      message: >-
        {% if trigger.id == 'robot' %}Suckist is stuck: {{ states('sensor.suckist_vacuum_error') | replace('_', ' ') }}.
        {% elif trigger.id == 'dock' %}The dock has a problem: {{ states('sensor.suckist_dock_dock_error') | replace('_', ' ') }}.
        {% elif trigger.id == 'clean_water' %}The dock's clean water tank needs filling.
        {% else %}The dock's dirty water tank needs emptying.{% endif %}
  - action: notify.mobile_app_schlixel
    data:
      title: Suckist
      message: "{{ message | trim }}"
  - action: notify.send_message
    target:
      entity_id: notify.alyssas_iphone
    data:
      title: Suckist
      message: "{{ message | trim }}"
  mode: queued
- id: suckist_auto_clean
  alias: Suckist auto-clean
  description: >-
    Cleans by the robot's own last-clean end (manual runs count). From 2 days after it, starts the next time the house
    is empty (zone.home 0 for 5 minutes), any time of day. If that hasn't happened by the first noon at least 4 days after
    it, starts at noon anyway, home or not. Checks when we leave and every 15 minutes (so it retries until 20:00 if it
    couldn't start). Never while it's off the dock, never twice in a day. Switch: input_boolean.suckist_auto; it sets
    the robot to input_select.suckist_auto_* first.
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for: 00:05:00
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: input_boolean.suckist_auto
    state: "on"
  - condition: state
    entity_id: vacuum.suckist
    state: docked
  - condition: template
    value_template: >-
      {% set began = as_datetime(states('sensor.suckist_last_clean_begin')) %}
      {{ began is none or as_local(began).date() != now().date() }}
  - condition: template
    value_template: "{{ reason != '' }}"
  variables:
    reason: >-
      {% set ended = as_datetime(states('sensor.suckist_last_clean_end')) %}
      {% set noon = today_at('12:00') %}
      {% if ended is none %}
      {% elif today_at('12:00') <= now() < today_at('20:00') and noon - ended >= timedelta(days=4) %}overdue
      {% elif now() - ended >= timedelta(days=2) and is_state('zone.home', '0')
         and now() - states.zone.home.last_changed >= timedelta(minutes=5) %}away
      {% endif %}
  actions:
  - variables:
      message: >-
        Cleaning now{{ ", you're both out" if reason | trim == 'away' else ", it's overdue" }}: it's been
        {{ states('sensor.suckist_days_since_clean') | float(0) | round(1) }} days.
  # The Vacuum page's "Timed clean settings".
  - action: select.select_option
    target:
      entity_id: select.suckist_cleaning_mode
    data:
      option: >-
        {{ {'Vacuum and mop': 'vac_and_mop', 'Vacuum only': 'vacuum', 'Mop only': 'mop'}
           [states('input_select.suckist_auto_mode')] | default('vac_and_mop') }}
  - action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.suckist
    data:
      fan_speed: >-
        {{ {'Quiet': 'quiet', 'Balanced': 'balanced', 'Turbo': 'turbo', 'Max': 'max', 'Max+': 'max_plus'}
           [states('input_select.suckist_auto_suction')] | default('turbo') }}
  - action: select.select_option
    target:
      entity_id: select.suckist_mop_intensity
    data:
      option: "{{ states('input_select.suckist_auto_water') | lower if has_value('input_select.suckist_auto_water') else 'medium' }}"
  - action: select.select_option
    target:
      entity_id: select.suckist_mop_mode
    data:
      option: >-
        {{ {'Fast': 'fast', 'Standard': 'standard', 'Deep': 'deep', 'Deep+': 'deep_plus'}
           [states('input_select.suckist_auto_route')] | default('standard') }}
  - action: vacuum.start
    target:
      entity_id: vacuum.suckist
  - action: notify.mobile_app_schlixel
    data:
      title: Suckist
      message: "{{ message | trim }}"
  - action: notify.send_message
    target:
      entity_id: notify.alyssas_iphone
    data:
      title: Suckist
      message: "{{ message | trim }}"
  mode: single
- id: brendan_left_work
  alias: Brendan left work
  description: >-
    Tells Alyssa when Brendan leaves his work (zone.work, "Brendan's work") after being there at least 30 minutes,
    so driving past doesn't count, with the drive time home: Waze (live traffic, from where he is; its polling is off because
    Waze limits requests per IP, so it's refreshed here), or OpenStreetMap routing without traffic if Waze fails.
  triggers:
  - trigger: zone
    entity_id: person.brend
    zone: zone.work
    event: leave
  conditions:
  - condition: template
    value_template: "{{ now() - trigger.from_state.last_changed >= timedelta(minutes=30) }}"
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.waze_brendan_drive_home
    continue_on_error: true
  - delay: 00:00:05
  - variables:
      waze: >-
        {{ states('sensor.waze_brendan_drive_home') | float(0) | round(0) | int
           if now() - states.sensor.waze_brendan_drive_home.last_updated < timedelta(minutes=2) else 0 }}
  - if:
    - condition: template
      value_template: "{{ waze == 0 }}"
    then:
    - action: rest_command.drive_home
      data:
        lat: "{{ state_attr('person.brend', 'latitude') or state_attr('zone.work', 'latitude') }}"
        lon: "{{ state_attr('person.brend', 'longitude') or state_attr('zone.work', 'longitude') }}"
      response_variable: route
      continue_on_error: true
  - variables:
      minutes: >-
        {% if waze %}{{ waze }}
        {% elif route is defined and route.status == 200 and route.content.routes is defined %}{{ (route.content.routes[0].duration / 60) | round(0) | int }}
        {% else %}0{% endif %}
      traffic: "{{ waze != 0 }}"
  - action: notify.send_message
    target:
      entity_id: notify.alyssas_iphone
    data:
      title: Brendan
      message: >-
        Left work{{ (', home in about ' ~ (minutes | trim) ~ ' min' ~ ('' if traffic else ' (no traffic info)'))
        if (minutes | trim | int(0)) else '' }}.
  mode: single
- id: schlesla_plug_in
  alias: Schlesla plug-in reminder
  description: >-
    At 9 pm, if the Tesla is parked at home under 50% and not plugged in, tells Brendan. Readings can be up to 10
    minutes old (the car is polled every 10 minutes and not woken).
  triggers:
  - trigger: time
    at: "21:00:00"
  conditions:
  - condition: state
    entity_id: device_tracker.schlesla_location
    state: home
  - condition: numeric_state
    entity_id: sensor.schlesla_battery_level
    below: 50
  - condition: state
    entity_id: binary_sensor.schlesla_charge_cable
    state: "off"
  actions:
  - action: notify.mobile_app_schlixel
    data:
      title: Plug in the car
      message: >-
        Schlesla is at {{ states('sensor.schlesla_battery_level') }}%
        ({{ states('sensor.schlesla_battery_range') | float(0) | round(0) | int }} km) and isn't plugged in.
  mode: single
- id: schlesla_left_open
  alias: Schlesla left open
  description: >-
    At 10:30 pm, if the Tesla is at home and unlocked, or a door, window, frunk or trunk is open, tells Brendan with
    buttons to lock it and close the windows (handled by schlesla_left_open_action).
  triggers:
  - trigger: time
    at: "22:30:00"
  conditions:
  - condition: state
    entity_id: device_tracker.schlesla_location
    state: home
  - condition: template
    value_template: "{{ problems | count > 0 }}"
  variables:
    problems: >-
      {% set p = [] %}
      {% if is_state('lock.schlesla_lock', 'unlocked') %}{% set p = p + ['unlocked'] %}{% endif %}
      {% set open_doors = ['binary_sensor.schlesla_front_driver_door', 'binary_sensor.schlesla_front_passenger_door',
         'binary_sensor.schlesla_rear_driver_door', 'binary_sensor.schlesla_rear_passenger_door']
         | select('is_state', 'on') | list %}
      {% if open_doors %}{% set p = p + ['a door open'] %}{% endif %}
      {% if is_state('cover.schlesla_windows', 'open') %}{% set p = p + ['windows open'] %}{% endif %}
      {% if is_state('cover.schlesla_frunk', 'open') %}{% set p = p + ['frunk open'] %}{% endif %}
      {% if is_state('cover.schlesla_trunk', 'open') %}{% set p = p + ['trunk open'] %}{% endif %}
      {{ p }}
  actions:
  - action: notify.mobile_app_schlixel
    data:
      title: Schlesla
      message: "The car is {{ problems | join(', ') }}."
      data:
        tag: schlesla_left_open
        actions:
        - action: SCHLESLA_LOCK
          title: Lock
        - action: SCHLESLA_CLOSE_WINDOWS
          title: Close windows
  mode: single
- id: schlesla_left_open_action
  alias: Schlesla left open (buttons)
  description: The Lock and Close windows buttons on schlesla_left_open's notification.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SCHLESLA_LOCK
    id: lock
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SCHLESLA_CLOSE_WINDOWS
    id: windows
  actions:
  - if:
    - condition: trigger
      id: lock
    then:
    - action: lock.lock
      target:
        entity_id: lock.schlesla_lock
    else:
    - action: cover.close_cover
      target:
        entity_id: cover.schlesla_windows
  mode: queued
- id: wifi_presence
  alias: Wi-Fi presence
  description: >-
    When a phone joins a Wi-Fi network we know, records a position for that person at that place
    (device_tracker.alyssa_wifi / brendan_wifi, legacy trackers made by device_tracker.see, in each person's
    trackers). The person takes the latest GPS-type update, so this places them straight away even when the
    phone's own location is slow or a little off; the phone's next location update takes over again. Networks:
    lo-fi = home, "Peck Home Mesh" = Alyssa's parents (seen 2026-10-09..12 at their house). The SSID only reaches
    HA when the app can (on Wi-Fi at home, or over WireGuard), like everything else from the phone.
  triggers:
  - trigger: state
    entity_id: sensor.alyssas_iphone_ssid
    id: alyssa
  - trigger: state
    entity_id: sensor.schlixel_wi_fi_connection
    id: brendan
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none and trigger.to_state.state in networks }}"
  variables:
    networks:
      lo-fi: zone.home
      Peck Home Mesh: zone.alyssa_s_parents
  actions:
  - variables:
      zone: "{{ networks[trigger.to_state.state] }}"
  - action: device_tracker.see
    data:
      dev_id: "{{ trigger.id }}_wifi"
      host_name: "{{ trigger.id | title }} Wi-Fi"
      gps: "{{ [state_attr(zone, 'latitude'), state_attr(zone, 'longitude')] }}"
      gps_accuracy: 0
  mode: queued
- id: opf_arm_commute
  alias: OPF · watch chargers after work
  description: Arm Brendan's arrival alert after a work visit of at least 30 minutes. Helpers survive restarts.
  triggers:
    - trigger: zone
      entity_id: person.brend
      zone: zone.work
      event: leave
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and
           now() - trigger.from_state.last_changed >= timedelta(minutes=30) }}
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.opf_left_work
      data:
        timestamp: "{{ now().timestamp() }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.opf_commute_pending
  mode: single
- id: opf_notify_approaching_home
  alias: OPF · Rengstorff availability approaching home
  description: Once per commute, within 2 km of home and 4 hours of leaving work. Unknown availability is explicit.
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.opf_commute_pending', 'on')
           and 0 <= now().timestamp() - as_timestamp(states('input_datetime.opf_left_work'), 0) < 14400
           and has_value('person.brend')
           and state_attr('person.brend', 'latitude') is number
           and state_attr('person.brend', 'longitude') is number
           and distance('person.brend', 'zone.home') is number
           and distance('person.brend', 'zone.home') < 2 }}
  actions:
    - action: notify.mobile_app_schlixel
      data:
        title: Rengstorff charging
        message: >-
          {% for site, eid in [('Community Center', 'sensor.opf_community_center_free'),
                                ('Aquatics Center', 'sensor.opf_aquatics_center_free')] %}
            {% set checked = as_timestamp(states('sensor.opf_last_checked'), 0) %}
            {% if has_value(eid) and 0 <= now().timestamp() - checked < 300 %}
              {{ site }}: {{ states(eid) }} of {{ state_attr(eid, 'total') }} free{% if states(eid) | int(0) > 0 %}
              ({{ state_attr(eid, 'available_chargers') | join(', ') }}){% endif %}.
            {% else %}
              {{ site }}: availability unknown; check OPF.
            {% endif %}
          {% endfor %}
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.opf_commute_pending
  mode: single
- id: opf_clear_old_commute
  alias: OPF · clear old commute
  triggers:
    - trigger: zone
      entity_id: person.brend
      zone: zone.work
      event: enter
    - trigger: template
      value_template: >-
        {{ is_state('input_boolean.opf_commute_pending', 'on') and
           now().timestamp() - as_timestamp(states('input_datetime.opf_left_work'), 0) >= 14400 }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.opf_commute_pending
  mode: single
- id: opf_watch_new_availability
  alias: OPF · a charger became available
  description: While watching, tell Brendan and Alyssa when a previously occupied connector becomes free at either site.
  triggers:
    - trigger: state
      entity_id:
        - sensor.opf_community_center_free
        - sensor.opf_aquatics_center_free
  variables:
    newly_free: >-
      {% if trigger is defined and trigger.from_state is not none and trigger.to_state is not none %}
        {{ trigger.to_state.attributes.get('available_chargers', [])
           | reject('in', trigger.from_state.attributes.get('available_chargers', [])) | list }}
      {% else %}{{ [] }}{% endif %}
    site_name: >-
      {{ 'Community Center' if trigger is defined and trigger.entity_id == 'sensor.opf_community_center_free'
         else 'Aquatics Center' }}
  conditions:
    - condition: state
      entity_id: input_boolean.opf_watch
      state: 'on'
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.to_state is not none
           and is_number(trigger.from_state.state) and is_number(trigger.to_state.state)
           and newly_free | length > 0 }}
  actions:
    - variables:
        message: >-
          {{ site_name }}: {{ newly_free | length }} charger{{ 's' if newly_free | length != 1 else '' }}
          just became free ({{ newly_free | join(', ') }}).
          {{ trigger.to_state.state }} of {{ trigger.to_state.attributes.total }} now available.
    - action: notify.mobile_app_schlixel
      continue_on_error: true
      data:
        title: Rengstorff charger available
        message: "{{ message }}"
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.alyssas_iphone
      data:
        title: Rengstorff charger available
        message: "{{ message }}"
  mode: queued
  max: 10
