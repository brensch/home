- id: '1754677598257'
  alias: 'Turn off lights when we leave '
  description: When the last person leaves home, turn off the lights.
  # zone.home's state is how many people are home; 0 means the last of us left.
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    not_from:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id:
      - balcony
      - bedroom
      - closet
      - kitchen
      - living_room
  mode: single
- id: '1755055880057'
  alias: Alyssa arrival flash (green)
  use_blueprint:
    path: brensch/arrival_flash.yaml
    input:
      arrival_person: person.alyssa
      flash_color:
      - 0
      - 255
      - 0
      flash_lights:
      - light.kitchen_all
      - light.living_room_all
      flash_lock: input_boolean.arrival_flash_lock
- id: '1755145185715'
  alias: Brend arrival flash (red)
  use_blueprint:
    path: brensch/arrival_flash.yaml
    input:
      arrival_person: person.brend
      flash_color:
      - 255
      - 0
      - 0
      flash_lights:
      - light.kitchen_all
      - light.living_room_all
      flash_lock: input_boolean.arrival_flash_lock
- id: '1755761528874'
  alias: Kitchen hue button
  description: Button 4 ("love button") on the kitchen dimmer notifies both phones.
  # Was a `domain: hue` device trigger, which the Hue v2 API no longer provides —
  # it failed to bind on every startup and the automation was auto-disabled.
  # Now uses the button event entity, same as the dimmer automations.
  triggers:
  - trigger: state
    entity_id: event.kitchen_switch_button_4
    attribute: event_type
    to: initial_press
  conditions: []
  actions:
  - action: notify.mobile_app_schlixel
    metadata: {}
    data:
      message: Love
      title: Hi
  - action: notify.send_message
    target:
      entity_id: notify.alyssas_iphone
    data:
      message: Love!
      title: Love button pressed
  mode: single
- id: '1755762394301'
  alias: Closet motion on
  description: ''
  triggers:
  - type: motion
    device_id: f774ae3b8b0050770a392fdd7293ab88
    entity_id: af0cbcb2a6b56b41d94709b2c4c43611
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      area_id: closet
  mode: single
- id: '1755762460777'
  alias: Closet motion off
  description: ''
  triggers:
  - type: no_motion
    device_id: f774ae3b8b0050770a392fdd7293ab88
    entity_id: af0cbcb2a6b56b41d94709b2c4c43611
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id: closet
  mode: single
