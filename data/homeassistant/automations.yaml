- id: '1754677598257'
  alias: 'Turn off lights when we leave '
  description: When the last person leaves home, turn off the lights.
  # zone.home's state is how many people are home; 0 means the last of us left.
  triggers:
  - trigger: state
    entity_id: zone.home
    to: '0'
    not_from:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id:
      - balcony
      - bedroom
      - closet
      - kitchen
      - living_room
  mode: single
- id: arrival_flash
  alias: Arrival flash
  description: Flash both Lines and the kitchen table light in the arriver's colour, then (after dark) turn the living room on.
  # not_from keeps an HA restart (unknown/unavailable -> home) from flashing.
  triggers:
  - trigger: state
    entity_id: person.alyssa
    to: home
    not_from:
    - unknown
    - unavailable
    variables:
      color: [0, 255, 200]    # aqua
  - trigger: state
    entity_id: person.brend
    to: home
    not_from:
    - unknown
    - unavailable
    variables:
      color: [255, 110, 0]    # orange
  actions:
  - action: script.flash_lights
    data:
      lights:
      - light.lines_kitchen
      - light.lines_desk
      - light.fan_front    # kitchen table light
      color: '{{ color }}'
      hold: 5
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - action: light.turn_on
    target:
      entity_id: light.living_room_all
    data:
      transition: 2
  # flash_lights queues overlapping calls itself; parallel just hands them over.
  mode: parallel
- id: '1755761528874'
  alias: Kitchen hue button
  description: Button 4 ("love button") on the kitchen dimmer notifies both phones.
  # Was a `domain: hue` device trigger, which the Hue v2 API no longer provides —
  # it failed to bind on every startup and the automation was auto-disabled.
  # Now uses the button event entity, same as the dimmer automations.
  triggers:
  - trigger: state
    entity_id: event.kitchen_switch_button_4
    attribute: event_type
    to: initial_press
  conditions: []
  actions:
  - action: notify.mobile_app_schlixel
    metadata: {}
    data:
      message: Love
      title: Hi
  - action: notify.send_message
    target:
      entity_id: notify.alyssas_iphone
    data:
      message: Love!
      title: Love button pressed
  mode: single
