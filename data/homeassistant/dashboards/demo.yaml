      show_name: false
      icon: mdi:flower-tulip
      grid_options:
        columns: 3
        rows: 1
    - type: heading
      heading: G — Coloured mood tiles
      heading_style: subtitle
    - type: tile
      entity: script.mood_bright
      name: Bright
      icon: mdi:white-balance-sunny
      color: amber
      tap_action:
        action: perform-action
        perform_action: script.mood_bright
      grid_options:
        columns: 6
    - type: tile
      entity: script.mood_evening
      name: Evening
      icon: mdi:weather-sunset
      color: deep-orange
      tap_action:
        action: perform-action
        perform_action: script.mood_evening
      grid_options:
        columns: 6
    - type: tile
      entity: script.mood_night
      name: Night
      icon: mdi:weather-night
      color: indigo
      tap_action:
        action: perform-action
        perform_action: script.mood_night
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: H — Light dial
    - type: light
      entity: light.living_room_all
      name: Living room
    - type: heading
      heading: I — Glance row
      heading_style: subtitle
    - type: glance
      show_state: true
      entities:
      - entity: light.living_room_all
        name: Living
      - entity: light.kitchen_all
        name: Kitchen
      - entity: light.bedroom
        name: Bed
      - entity: light.balcony
        name: Balcony
    - type: heading
      heading: J — List with toggles
      heading_style: subtitle
    - type: entities
      entities:
      - entity: light.living_room_all
        name: Living room
      - entity: light.kitchen_all
        name: Kitchen
      - entity: light.bedroom
        name: Bedroom
  - type: grid
    cards:
    - type: heading
      heading: K — Heading with pill switches
      badges:
      - type: entity
        entity: light.living_room_all
        name: Living
        show_name: true
        tap_action:
          action: toggle
      - type: entity
        entity: light.kitchen_all
        name: Kitchen
        show_name: true
        tap_action:
          action: toggle
      - type: entity
        entity: light.bedroom
        name: Bed
        show_name: true
        tap_action:
          action: toggle
    - type: heading
      heading: L — Area card
      heading_style: subtitle
    - type: area
      area: living_room
    - type: heading
      heading: M — Gauge
      heading_style: subtitle
    - type: gauge
      entity: sensor.desk_power
      name: Desk power
      min: 0
      max: 600
      severity:
        green: 0
        yellow: 200
        red: 400
    - type: heading
      heading: N — Sensor with graph
      heading_style: subtitle
    - type: sensor
      entity: sensor.media_power
      name: Server power
      graph: line
      hours_to_show: 24
