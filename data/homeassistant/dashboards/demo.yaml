  - type: grid
    cards:
    - type: heading
      heading: A — Tile (default)
    - type: tile
      entity: light.living_room_all
      name: Living room
    - type: tile
      entity: light.kitchen_all
      name: Kitchen
    - type: heading
      heading: B — Tile, vertical
      heading_style: subtitle
    - type: tile
      entity: light.living_room_all
      name: Living room
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: light.kitchen_all
      name: Kitchen
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: tile
      entity: light.bedroom
      name: Bedroom
      vertical: true
      grid_options:
        columns: 4
        rows: 2
    - type: heading
      heading: C — Tile + sliders underneath
      heading_style: subtitle
    - type: tile
      entity: light.living_room_all
      name: Living room
      features_position: bottom
      features:
      - type: light-brightness
      - type: light-color-temp
      grid_options:
        columns: 12
    - type: heading
      heading: D — Tile + slider inline (compact)
      heading_style: subtitle
    - type: tile
      entity: light.living_room_all
      name: Living room
      features_position: inline
      features:
      - type: light-brightness
      grid_options:
        columns: 12
    - type: tile
      entity: light.kitchen_all
      name: Kitchen
      features_position: inline
      features:
      - type: light-brightness
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: E — Big buttons
    - type: button
      entity: light.living_room_all
      name: Living room
      show_state: true
      grid_options:
        columns: 6
        rows: 2
    - type: button
      entity: light.kitchen_all
      name: Kitchen
      show_state: true
      grid_options:
        columns: 6
        rows: 2
    - type: heading
      heading: F — Icon-only buttons
      heading_style: subtitle
    - type: button
      entity: light.living_room_all
      show_name: false
      icon: mdi:sofa
      grid_options:
        columns: 3
        rows: 1
    - type: button
      entity: light.kitchen_all
      show_name: false
      icon: mdi:countertop
      grid_options:
        columns: 3
        rows: 1
    - type: button
      entity: light.bedroom
      show_name: false
      icon: mdi:bed
      grid_options:
