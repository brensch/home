# Card styles side by side, all built into HA (no add-ons), on the same few
# entities. Pick letters and the real dashboards get restyled to match.
# P-R: room-control layouts (big on/off, small options, slider), newest first.
views:
- title: Demo
  path: demo
  icon: mdi:palette-swatch
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: person.brend
  - type: entity
    entity: weather.forecast_home
    show_name: true
  - type: entity
    entity: sensor.desk_power
    show_icon: false
    show_name: true
    name: Desk
  - type: entity
    entity: light.living_room_all
    show_state: false
    color: amber
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 'P — Cards: big switch + slider (2 per row)'
    - type: tile
      entity: light.living_room_all
      name: Living room
      icon: mdi:sofa
      hide_state: true
      icon_tap_action:
        action: toggle
      features_position: bottom
      features:
      - type: toggle
      - type: light-brightness
      grid_options:
        columns: 6
    - type: tile
      entity: light.kitchen_all
      name: Kitchen
      icon: mdi:countertop
      hide_state: true
      icon_tap_action:
        action: toggle
      features_position: bottom
      features:
      - type: toggle
      - type: light-brightness
      grid_options:
        columns: 6
    - type: tile
      entity: light.bedroom
      name: Bedroom
      icon: mdi:bed
      hide_state: true
      icon_tap_action:
        action: toggle
      features_position: bottom
      features:
      - type: toggle
      - type: light-brightness
      grid_options:
        columns: 6
    - type: tile
      entity: light.balcony
      name: Balcony
      icon: mdi:flower-tulip
      hide_state: true
      icon_tap_action:
        action: toggle
      features_position: bottom
      features:
      - type: toggle
      - type: light-brightness
      grid_options:
        columns: 6
    - type: tile
      entity: light.closet
      name: Closet
      icon: mdi:hanger
      hide_state: true
      icon_tap_action:
        action: toggle
      features_position: bottom
      features:
      - type: toggle
      - type: light-brightness
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: 'Q — One line per room: tap icon = on/off, slider, ⋮ = options'
    - type: tile
      entity: light.living_room_all
      name: Living room
      icon: mdi:sofa
      icon_tap_action:
        action: toggle
      features_position: inline
      features:
      - type: light-brightness
      grid_options:
        columns: 10
        rows: 1
    - type: button
      entity: light.living_room_all
      icon: mdi:dots-vertical
      show_name: false
      show_state: false
      state_color: false
      tap_action:
        action: more-info
      grid_options:
        columns: 2
        rows: 1
    - type: tile
      entity: light.kitchen_all
      name: Kitchen
      icon: mdi:countertop
      icon_tap_action:
        action: toggle
      features_position: inline
      features:
      - type: light-brightness
      grid_options:
        columns: 10
        rows: 1
    - type: button
      entity: light.kitchen_all
      icon: mdi:dots-vertical
      show_name: false
      show_state: false
      state_color: false
      tap_action:
        action: more-info
      grid_options:
        columns: 2
        rows: 1
    - type: tile
      entity: light.bedroom
      name: Bedroom
      icon: mdi:bed
      icon_tap_action:
        action: toggle
      features_position: inline
      features:
      - type: light-brightness
      grid_options:
        columns: 10
        rows: 1
    - type: button
