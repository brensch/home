# Command center: what you'd touch in a day, on one phone screen. Detail lives on
# the other dashboards (Rooms, Energy, System); this page only links to them.
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: person.brend
        name: Brend
        show_name: true
        show_state: true
      - type: entity
        entity: person.alyssa
        name: Alyssa
        show_name: true
        show_state: true
      - type: entity
        entity: weather.forecast_home
      - type: entity
        entity: sensor.hue_outdoor_motion_sensor_1_temperature
        name: Outside
        icon: mdi:thermometer
      # Alerts: only shown when something needs attention.
      - type: entity
        entity: switch.fridge_relay
        name: Fridge plug is OFF
        show_name: true
        icon: mdi:fridge-alert
        color: red
        visibility:
          - condition: state
            entity: switch.fridge_relay
            state: "off"
      - type: entity
        entity: sensor.front_door_switch_battery
        name: Front door switch battery
        show_name: true
        color: red
        tap_action: {action: navigate, navigation_path: /system-dash/system}
        visibility:
          - condition: numeric_state
            entity: sensor.front_door_switch_battery
            below: 15
      - type: entity
        entity: sensor.kitchen_switch_battery
        name: Kitchen switch battery
        show_name: true
        color: red
        tap_action: {action: navigate, navigation_path: /system-dash/system}
        visibility:
          - condition: numeric_state
            entity: sensor.kitchen_switch_battery
            below: 15
      - type: entity
        entity: sensor.bedroom_switch_battery
        name: Bedroom switch battery
        show_name: true
        color: red
        tap_action: {action: navigate, navigation_path: /system-dash/system}
        visibility:
          - condition: numeric_state
            entity: sensor.bedroom_switch_battery
            below: 15
      - type: entity
        entity: sensor.hue_outdoor_motion_sensor_1_battery
        name: Outdoor sensor battery
        show_name: true
        color: red
        tap_action: {action: navigate, navigation_path: /system-dash/system}
        visibility:
          - condition: numeric_state
            entity: sensor.hue_outdoor_motion_sensor_1_battery
            below: 15
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:floor-plan
            # Tap the heading for every bulb and scene in each room.
            tap_action: {action: navigate, navigation_path: /rooms-dash/rooms}
          # One line per room (www/room-row-card.js): bulb = on/off, slider, ⋮ = options.
          - {type: custom:room-row-card, entity: light.living_room_all, name: Living room, icon: mdi:sofa}
          - {type: custom:room-row-card, entity: light.kitchen_all, name: Kitchen, icon: mdi:stove}
          - {type: custom:room-row-card, entity: light.bedroom, name: Bedroom, icon: mdi:bed}
          - {type: custom:room-row-card, entity: light.balcony, name: Balcony, icon: mdi:flower-tulip}
          - {type: custom:room-row-card, entity: light.closet, name: Closet, icon: mdi:hanger}
          - type: tile
            entity: script.all_lights_off
            name: All off
            icon: mdi:power
            hide_state: true
            tap_action: &all_off
              action: perform-action
              perform_action: script.all_lights_off
              confirmation: {text: "Turn off every light in the house?"}
            icon_tap_action: *all_off
            grid_options: {columns: 12, rows: 1}
      - type: grid
        cards:
          - type: heading
            heading: TV
            icon: mdi:television
          - type: tile
            entity: media_player.tv
            name: TV
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.tv_cast
                state_not: "off"
            card:
              type: media-control
              entity: media_player.tv_cast
      - type: grid
        cards:
          - type: heading
            heading: At a glance
            icon: mdi:eye
          - type: tile
            entity: sensor.fridge_power
            name: Fridge
            icon: mdi:fridge
            tap_action: {action: navigate, navigation_path: /system-dash/system}
          - type: tile
            entity: sensor.elec_account_3015750579_current_bill_electric_cost_to_date
            name: Bill so far
            icon: mdi:cash
            tap_action: {action: navigate, navigation_path: /energy}
          - type: tile
            entity: sensor.elec_account_3015750579_current_bill_electric_forecasted_cost
            name: Bill forecast
            icon: mdi:cash-clock
            tap_action: {action: navigate, navigation_path: /energy}
