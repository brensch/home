# Status dashboard: power, the bill, batteries, backups.
# Server (media) and fridge plugs are shown as power readings, not toggles, so
# nobody switches them off from here by accident.
views:
  - title: House
    path: house
    icon: mdi:home-analytics
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Power now
          - type: tile
            entity: sensor.fridge_power
            name: Fridge
            icon: mdi:fridge
          - type: tile
            entity: sensor.desk_power
            name: Desk (PC + Mac mini)
            icon: mdi:desktop-tower-monitor
          - type: tile
            entity: sensor.media_power
            name: Home server
            icon: mdi:server
          - type: tile
            entity: sensor.piano_power
            name: Piano
            icon: mdi:piano
      - type: grid
        cards:
          - type: heading
            heading: This bill (PG&E, 1-2 days behind)
          - type: tile
            entity: sensor.elec_account_3015750579_current_bill_electric_cost_to_date
            name: Cost so far
          - type: tile
            entity: sensor.elec_account_3015750579_current_bill_electric_forecasted_cost
            name: Forecast
          - type: tile
            entity: sensor.elec_account_3015750579_typical_monthly_electric_cost
            name: Typical month
          - type: tile
            entity: sensor.electricity_maps_grid_fossil_fuel_percentage
            name: Grid fossil share now
            icon: mdi:factory
          - type: statistics-graph
            title: Daily use, kWh
            period: day
            days_to_show: 7
            chart_type: bar
            stat_types:
              - change
            entities:
              - entity: opower:pge_elec_3015750579_energy_consumption
                name: Whole house
              - entity: sensor.desk_energy
                name: Desk
              - entity: sensor.media_energy
                name: Server
              - entity: sensor.fridge_energy
                name: Fridge
      - type: grid
        cards:
          - type: heading
            heading: Upkeep
          - type: tile
            entity: sensor.front_door_switch_battery
            name: Front door switch
          - type: tile
            entity: sensor.kitchen_switch_battery
            name: Kitchen switch
          - type: tile
            entity: sensor.bedroom_switch_battery
            name: Bedroom switch
          - type: tile
            entity: sensor.hue_outdoor_motion_sensor_1_battery
            name: Outdoor motion
          - type: tile
            entity: sensor.closet_battery
            name: Closet sensor
          - type: tile
            entity: sensor.backup_last_successful_automatic_backup
            name: Last backup
          - type: tile
            entity: input_datetime.server_heartbeat
            name: Server heartbeat
