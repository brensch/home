# Places: where each of us has been, for whatever range the date picker at the bottom shows (www/presence-card.js).
# The History page's timeline for the range, then the donuts, which read the "<Name> at <Place>" sensors' long-term statistics (configuration.yaml), the map
# every raw position of the phones' GPS trackers and the car; history is kept for 10 years (recorder).
views:
- title: Places
  path: places
  icon: mdi:map-marker-radius
  type: sections
  max_columns: 2
  footer:
    card:
      type: energy-date-selection
      opening_direction: right
      vertical_opening_direction: up
  sections:
  # Where each of us was, as the History page draws it, for the picked range.
  - type: grid
    column_span: 2
    cards:
    - type: custom:presence-timeline-card
      title: Where we've been
      entities:
      - {entity: person.brend, name: Brendan}
      - {entity: person.alyssa, name: Alyssa}
    - type: custom:presence-card
      title: Brendan
      columns: 12
      places:
      - {name: Home, entity: sensor.brendan_at_home, color: '#3ca951'}
      - {name: Work, entity: sensor.brendan_at_brendan_s_work, color: '#4269d0'}
      - {name: Gym, entity: sensor.brendan_at_gym, color: '#efb118'}
      - {name: Alyssa's parents, entity: sensor.brendan_at_alyssa_s_parents, color: '#ff8ab7'}
      - {name: Away, entity: sensor.brendan_at_away, color: '#9e9e9e'}
    - type: custom:presence-card
      title: Alyssa
      columns: 12
      places:
      - {name: Home, entity: sensor.alyssa_at_home, color: '#3ca951'}
      - {name: Gym, entity: sensor.alyssa_at_gym, color: '#efb118'}
      - {name: Her parents, entity: sensor.alyssa_at_alyssa_s_parents, color: '#ff8ab7'}
      - {name: Away, entity: sensor.alyssa_at_away, color: '#9e9e9e'}
    - type: custom:presence-map-card
      title: Every point
      entities:
      - {entity: device_tracker.brend_phone, name: Brendan, color: '#4269d0'}
      - {entity: device_tracker.alyssas_iphone, name: Alyssa, color: '#ff725c'}
      - {entity: device_tracker.schlesla_location, name: Schlesla, color: '#6cc5b0'}
      zones: [zone.home, zone.work, zone.gym, zone.alyssa_s_parents]
