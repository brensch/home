# Electricity: the Energy dashboard's "individual devices" graph on its own. One stacked bar per hour/day/month: the
# PG&E meter's total split into the plugs (Fridge, Desk PC, Media, Piano) and the rest as "Untracked", so it's the
# whole house's usage and the devices in one chart. Sources and devices are set in Settings → Dashboards → Energy.
views:
- title: Electricity
  path: electricity
  icon: mdi:lightning-bolt
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: energy-date-selection
      grid_options: {columns: full}
    - type: energy-devices-detail-graph
      title: Electricity
      grid_options: {columns: full}
