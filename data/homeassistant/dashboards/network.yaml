# Network: who's connected and whether the internet's up. Traffic, load and per-device data live in UniFi's own
# app (Traffic Identification is on there, linked below); HA keeps only the router's temperature and CPU, once a
# minute.
views:
- title: Network
  path: network
  icon: mdi:router-wireless
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Network
      icon: mdi:router-wireless
    - type: tile
      entity: binary_sensor.internet_connection
      name: Internet
      icon: mdi:web
    - type: tile
      entity: sensor.lo_fi_clients
      name: Devices on lo-fi
      icon: mdi:wifi
    - type: tile
      entity: sensor.router_temperature
      name: Router temperature
    - type: tile
      entity: sensor.router_cpu
      name: Router CPU
    - type: tile
      entity: update.schrouter_firmware
      name: Router firmware
    # router.brensch.com is Caddy in front of the UDR's console (home network and WireGuard only).
    - type: button
      name: Open UniFi
      icon: mdi:open-in-new
      show_state: false
      grid_options: {columns: 6, rows: 1}
      layout: horizontal
      tap_action:
        action: url
        url_path: https://router.brensch.com/network/default/dashboard
    - type: history-graph
      title: Router, last 24 hours
      hours_to_show: 24
      grid_options: {columns: full}
      entities:
      - entity: sensor.router_temperature
        name: Temperature
      - entity: sensor.router_cpu
        name: CPU
  # Each device while it's connected, with its IP (the UniFi tracker's ip attribute).
  - type: grid
    cards:
    - type: heading
      heading: Connections
      icon: mdi:lan
    - type: heading
      heading: On lo-fi
