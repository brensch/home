# Suckist, the Roborock Qrevo S (roborock.vacuum.a104) and its dock. Roborock integration (cloud login for setup,
# then commands over the LAN to 192.168.20.10:58867; the robot lives on its own VLAN, see ~/CLAUDE.md).
# Sections flow across three columns: now / clean now / auto-clean, then map / dock / maintenance, then the graphs
# full width. Rooms are Roborock segment ids (script.suckist_clean_rooms).
views:
- title: Vacuum
  path: vacuum
  icon: mdi:robot-vacuum
  type: sections
  max_columns: 3
  sections:
  # What it's doing and how long since it last cleaned (the robot's own last-clean end).
  - type: grid
    cards:
    - type: heading
      heading: Suckist
      icon: mdi:robot-vacuum
      badges:
      - {type: entity, entity: sensor.suckist_battery, show_state: true, show_icon: true}
      - type: entity
        entity: sensor.suckist_current_room
        show_state: true
        show_icon: true
        visibility:
        - {condition: state, entity: vacuum.suckist, state: cleaning}
    - type: entity
      entity: sensor.suckist_days_since_clean
      name: Since last vacuumed
      icon: mdi:timer-sand
      grid_options: {columns: full}
    - type: tile
      entity: vacuum.suckist
      name: Suckist
      grid_options: {columns: full}
      features_position: bottom
      features:
      - type: vacuum-commands
        commands: [start_pause, stop, return_home, locate]
    - type: tile
      entity: sensor.suckist_vacuum_error
      name: Robot problem
      icon: mdi:alert-circle-outline
      grid_options: {columns: full}
      visibility:
      - {condition: state, entity: sensor.suckist_vacuum_error, state_not: none}
    - type: tile
      entity: sensor.suckist_dock_dock_error
      name: Dock problem
      icon: mdi:alert-circle-outline
      grid_options: {columns: full}
      visibility:
      - {condition: state, entity: sensor.suckist_dock_dock_error, state_not: ok}
  # Ad hoc: tap a room to clean just that room now, or Everywhere for the whole house.
  - type: grid
    cards:
    - type: heading
      heading: Clean now
      icon: mdi:gesture-tap
    - type: tile
      entity: input_boolean.suckist_adhoc_mop
      name: Mop as well
      grid_options: {columns: full}
      features_position: inline
      features: [{type: toggle}]
    - type: button
      name: Everywhere
      icon: mdi:home-outline
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: []}
    - type: button
      name: Living room
      icon: mdi:sofa-outline
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: [16]}
    - type: button
      name: Kitchen
      icon: mdi:countertop-outline
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: [21]}
    - type: button
      name: Bedroom
      icon: mdi:bed-outline
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: [19]}
    - type: button
      name: Bathroom
      icon: mdi:shower
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: [17]}
    - type: button
      name: Corridor
      icon: mdi:door-open
      grid_options: {columns: 4, rows: 2}
      tap_action:
        action: perform-action
        perform_action: script.suckist_clean_rooms
        data: {rooms: [22]}
  # Automation suckist_auto_clean: after 2 days when we're both out, after 4 at noon regardless; it sets these on the
  # robot before each run.
  - type: grid
    cards:
    - type: heading
      heading: Auto-clean
      icon: mdi:calendar-clock
    - type: tile
      entity: input_boolean.suckist_auto
      name: Auto-clean
      grid_options: {columns: full}
      features_position: inline
      features: [{type: toggle}]
    - type: markdown
      grid_options: {columns: full}
      content: >-
        {% set ended = as_datetime(states('sensor.suckist_last_clean_end')) %}
        {% if ended is not none %}
        {% set away_from = ended + timedelta(days=2) %}
        {% set force = as_local(ended + timedelta(days=4)) %}
        {% set force = force.replace(hour=12, minute=0, second=0) if force.hour < 12
           else (force + timedelta(days=1)).replace(hour=12, minute=0, second=0) %}
        {% if is_state('vacuum.suckist', 'cleaning') %}**Cleaning now.**
        {% elif is_state('input_boolean.suckist_auto', 'off') %}Auto-clean is off.
        {% elif now() < away_from %}Cleans when you're both out from {{ as_local(away_from).strftime('%a %-I %p') }},
        or {{ force.strftime('%a') }} at noon regardless.
        {% else %}Cleans the next time you're both out, or {{ 'today' if force.date() == now().date()
           else force.strftime('%a') }} at noon regardless.
        {% endif %}
        {% endif %}
    - type: tile
      entity: input_select.suckist_auto_mode
      name: Mode
      grid_options: {columns: full}
      features_position: inline
      features: [{type: select-options}]
    - type: tile
      entity: input_select.suckist_auto_suction
      name: Suction
      grid_options: {columns: full}
      features_position: inline
      features: [{type: select-options}]
    - type: tile
      entity: input_select.suckist_auto_water
      name: Mop water
      grid_options: {columns: full}
      features_position: inline
      features: [{type: select-options}]
      visibility:
      - condition: state
        entity: input_select.suckist_auto_mode
        state_not: Vacuum only
    - type: tile
      entity: input_select.suckist_auto_route
      name: Mop route
      grid_options: {columns: full}
      features_position: inline
      features: [{type: select-options}]
      visibility:
      - condition: state
        entity: input_select.suckist_auto_mode
        state_not: Vacuum only
  - type: grid
    cards:
    - type: heading
      heading: Map
      icon: mdi:map-outline
    # Roborock's map as an image, redrawn while it cleans.
    - type: picture-entity
      entity: image.suckist_map_0
      show_name: false
      show_state: false
      grid_options: {columns: full}
  - type: grid
    cards:
    - type: heading
      heading: Dock
      icon: mdi:home-import-outline
    - type: tile
      entity: binary_sensor.suckist_dock_clean_water_box
      name: Clean water
    - type: tile
      entity: binary_sensor.suckist_dock_dirty_water_box
      name: Dirty water
    - type: tile
      entity: sensor.suckist_dock_mop_drying_remaining_time
      name: Mop drying left
    - type: tile
      entity: select.suckist_dock_empty_mode
      name: Auto-empty
    - type: heading
      heading: Dock actions on robot
      heading_style: subtitle
    # Roborock exposes these as switches whose state is only "is the dock doing this right now" (off = idle, not
    # "empty" or "clean"); nothing reports how full the bin is. So: no state text, tap to start, lit while it runs.
    - type: tile
      entity: switch.suckist_dock_dust_emptying
      name: Empty bin
      hide_state: true
      tap_action: {action: toggle}
      icon: mdi:delete-empty-outline
      grid_options: {columns: 4}
      vertical: true
    - type: tile
      entity: switch.suckist_dock_mop_washing
      name: Wash mop
      hide_state: true
      tap_action: {action: toggle}
      icon: mdi:water-sync
      grid_options: {columns: 4}
      vertical: true
    - type: tile
      entity: switch.suckist_dock_mop_drying
      name: Dry mop
      hide_state: true
      tap_action: {action: toggle}
      icon: mdi:fan
      grid_options: {columns: 4}
      vertical: true
  - type: grid
    cards:
    - type: heading
      heading: Maintenance
      icon: mdi:wrench-outline
    - type: markdown
      grid_options: {columns: full}
      content: >-
        Hours left before each part is due; negative means overdue. Hold a tile to reset its timer after replacing
        or cleaning that part.
    - type: tile
      entity: sensor.suckist_main_brush_time_left
      name: Main brush
      icon: mdi:brush
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_main_brush_consumable}, confirmation: {text: "Reset the main brush timer?"}}
    - type: tile
      entity: sensor.suckist_side_brush_time_left
      name: Side brush
      icon: mdi:brush-variant
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_side_brush_consumable}, confirmation: {text: "Reset the side brush timer?"}}
    - type: tile
      entity: sensor.suckist_filter_time_left
      name: Filter
      icon: mdi:air-filter
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_air_filter_consumable}, confirmation: {text: "Reset the filter timer?"}}
    - type: tile
      entity: sensor.suckist_sensor_time_left
      name: Sensors (wipe)
      icon: mdi:eye-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_sensor_consumable}, confirmation: {text: "Reset the sensor cleaning timer?"}}
    - type: tile
      entity: sensor.suckist_dock_strainer_time_left
      name: Dock strainer
      icon: mdi:filter-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_dock_reset_strainer_consumable}, confirmation: {text: "Reset the dock strainer timer?"}}
    - type: tile
      entity: sensor.suckist_dock_maintenance_brush_time_left
      name: Dock brush
      icon: mdi:brush-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_dock_reset_cleaning_brush_consumable}, confirmation: {text: "Reset the dock brush timer?"}}
  # Recorder keeps 10 days of history; the cleans-per-day chart is long-term statistics.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: history-graph
      title: Battery · %
      hours_to_show: 48
      grid_options: {columns: 6}
      entities:
      - entity: sensor.suckist_battery
        name: Battery
    - type: history-graph
      title: Days since a clean
      hours_to_show: 240
      grid_options: {columns: 6}
      entities:
      - entity: sensor.suckist_days_since_clean
        name: Days
    - type: history-graph
      title: What it did, and who was home
      hours_to_show: 168
      grid_options: {columns: full}
      entities:
      - entity: sensor.suckist_status
        name: Suckist
      - entity: person.brend
        name: Brendan
      - entity: person.alyssa
        name: Alyssa
    - type: statistics-graph
      title: Cleans per day
      entities:
      - entity: sensor.suckist_total_cleaning_count
        name: Cleans
      stat_types: [change]
      period: day
      days_to_show: 30
      chart_type: bar
      grid_options: {columns: 6}
    - type: history-graph
      title: Each clean · m²
      hours_to_show: 240
      grid_options: {columns: 6}
      entities:
      - entity: sensor.suckist_cleaning_area
        name: Area
