# Suckist, the Roborock Qrevo S (roborock.vacuum.a104) and its dock. Roborock integration (cloud login for setup,
# then commands over the LAN to 192.168.20.10:58867; the robot lives on its own VLAN, see ~/CLAUDE.md).
# Cleaning by room: name the rooms in the Roborock app, map them to HA areas in the vacuum's entity settings
# ("Areas"), then vacuum.clean_area.
views:
- title: Vacuum
  path: vacuum
  icon: mdi:robot-vacuum
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Suckist
      icon: mdi:robot-vacuum
      badges:
      - {type: entity, entity: sensor.suckist_battery, show_state: true, show_icon: true}
      - {type: entity, entity: sensor.suckist_current_room, show_state: true, show_icon: true}
    - type: tile
      entity: vacuum.suckist
      name: Suckist
      vertical: false
      grid_options: {columns: full}
      features_position: bottom
      features:
      - type: vacuum-commands
        commands: [start_pause, stop, return_home, locate, clean_spot]
      - type: vacuum-fan-speed
    - type: tile
      entity: sensor.suckist_status
      name: Doing
    - type: tile
      entity: sensor.suckist_vacuum_error
      name: Problem
      icon: mdi:alert-circle-outline
    - type: tile
      entity: select.suckist_cleaning_mode
      name: Mode
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: select-options
    - type: tile
      entity: select.suckist_mop_intensity
      name: Mop water
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: select-options
    - type: tile
      entity: select.suckist_mop_mode
      name: Mop route
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: select-options
  # Auto-clean: automations suckist_auto_clean / suckist_home_again / suckist_finished. The windows are a schedule
  # helper: tap it, then the cog, to drag the blocks around.
  - type: grid
    cards:
    - type: heading
      heading: Auto-clean
      icon: mdi:calendar-clock
      badges:
      - {type: entity, entity: schedule.suckist_cleaning_windows, name: Window, show_name: true, show_state: true, show_icon: false}
      - {type: entity, entity: zone.home, name: Home, show_name: true, show_state: true, show_icon: false}
    - type: tile
      entity: input_boolean.suckist_auto
      name: Auto-clean
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: toggle
    - type: markdown
      grid_options: {columns: full}
      content: >-
        {% set win = is_state('schedule.suckist_cleaning_windows', 'on') %}
        {% set nxt = state_attr('schedule.suckist_cleaning_windows', 'next_event') %}
        {% set away = states('zone.home') | int(1) == 0 %}
        {% set only_away = is_state('input_boolean.suckist_only_when_away', 'on') %}
        {% set days = states('sensor.suckist_days_since_clean') | float(0) %}
        {% set due_after = states('input_number.suckist_due_days') | float(2) %}
        {% set began = as_datetime(states('sensor.suckist_last_clean_begin')) %}
        {% set done_today = is_state('input_boolean.suckist_once_a_day', 'on') and began is not none
           and as_local(began).date() == now().date() %}
        {% if is_state('input_boolean.suckist_auto', 'off') %}
        **Auto-clean is off.** It only runs when you start it.
        {% else %}
        {% if win %}**A cleaning window is open** until {{ as_local(nxt).strftime('%H:%M') if nxt else 'later' }}.
        {%- if done_today %} It has already cleaned today.
        {%- elif only_away and not away %} It'll start once you've both left.
        {%- elif not is_state('vacuum.suckist', 'docked') %} It's off the dock right now.{% endif %}
        {% else %}**Next window:** {{ as_local(nxt).strftime('%A %-d %b, %H:%M') if nxt else 'none set' }}
        {%- if only_away %} (it waits until you've both left){% endif %}.
        {% endif %}

        {% if is_state('input_boolean.suckist_when_we_leave', 'on') %}
        {% if days >= due_after %}**Due:** {{ days }} days since it last cleaned, so it cleans next time you both leave.
        {% else %}Last cleaned {{ days }} days ago; due in {{ (due_after - days) | round(1) }} days, then it cleans
        next time you both leave.{% endif %}
        {% endif %}

        {% if is_state('input_boolean.suckist_skip_next', 'on') %}**The next run will be skipped.**{% endif %}
        {% endif %}
    - type: tile
      entity: schedule.suckist_cleaning_windows
      name: Cleaning windows
      icon: mdi:calendar-edit
      grid_options: {columns: full}
    - type: tile
      entity: input_boolean.suckist_only_when_away
      name: Only when we're out
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_boolean.suckist_once_a_day
      name: Once a day max
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_boolean.suckist_when_we_leave
      name: Clean when we leave if due
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_boolean.suckist_dock_when_home
      name: Dock when we're back
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_boolean.suckist_notify
      name: Tell us when it runs
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_boolean.suckist_skip_next
      name: Skip the next run
      features_position: inline
      features: [{type: toggle}]
    - type: tile
      entity: input_number.suckist_due_days
      name: Due after
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: input_select.suckist_auto_mode
      name: Mode
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: select-options
    - type: tile
      entity: sensor.suckist_days_since_clean
      name: Since last clean
    - type: tile
      entity: input_text.suckist_last_auto
      name: Last auto-clean
  - type: grid
    cards:
    - type: heading
      heading: Map
      icon: mdi:map-outline
    # Roborock's map as an image, redrawn while it cleans.
    - type: picture-entity
      entity: image.suckist_map_0
      show_name: false
      show_state: false
      grid_options: {columns: full}
  - type: grid
    cards:
    - type: heading
      heading: Dock
      icon: mdi:home-import-outline
    - type: tile
      entity: sensor.suckist_dock_dock_error
      name: Dock
    - type: tile
      entity: binary_sensor.suckist_dock_clean_water_box
      name: Clean water
    - type: tile
      entity: binary_sensor.suckist_dock_dirty_water_box
      name: Dirty water
    - type: tile
      entity: sensor.suckist_dock_mop_drying_remaining_time
      name: Mop drying left
    # These three switches start the dock doing it now (and show while it is).
    - type: tile
      entity: switch.suckist_dock_dust_emptying
      name: Empty the bin
      icon: mdi:delete-empty-outline
    - type: tile
      entity: switch.suckist_dock_mop_washing
      name: Wash the mop
      icon: mdi:water-sync
    - type: tile
      entity: switch.suckist_dock_mop_drying
      name: Dry the mop
      icon: mdi:fan
    - type: tile
      entity: select.suckist_dock_empty_mode
      name: Auto-empty
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: select-options
  - type: grid
    cards:
    - type: heading
      heading: Maintenance
      icon: mdi:wrench-outline
    - type: markdown
      grid_options: {columns: full}
      content: >-
        Hours left before each part is due; negative means overdue. Hold a tile to reset its timer after replacing
        or cleaning that part.
    - type: tile
      entity: sensor.suckist_main_brush_time_left
      name: Main brush
      icon: mdi:brush
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_main_brush_consumable}, confirmation: {text: "Reset the main brush timer?"}}
    - type: tile
      entity: sensor.suckist_side_brush_time_left
      name: Side brush
      icon: mdi:brush-variant
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_side_brush_consumable}, confirmation: {text: "Reset the side brush timer?"}}
    - type: tile
      entity: sensor.suckist_filter_time_left
      name: Filter
      icon: mdi:air-filter
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_air_filter_consumable}, confirmation: {text: "Reset the filter timer?"}}
    - type: tile
      entity: sensor.suckist_sensor_time_left
      name: Sensors (wipe)
      icon: mdi:eye-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_reset_sensor_consumable}, confirmation: {text: "Reset the sensor cleaning timer?"}}
    - type: tile
      entity: sensor.suckist_dock_strainer_time_left
      name: Dock strainer
      icon: mdi:filter-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_dock_reset_strainer_consumable}, confirmation: {text: "Reset the dock strainer timer?"}}
    - type: tile
      entity: sensor.suckist_dock_maintenance_brush_time_left
      name: Dock brush
      icon: mdi:brush-outline
      hold_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.suckist_dock_reset_cleaning_brush_consumable}, confirmation: {text: "Reset the dock brush timer?"}}
  - type: grid
    cards:
    - type: heading
      heading: Cleans
      icon: mdi:history
    - type: tile
      entity: sensor.suckist_last_clean_end
      name: Last finished
    - type: tile
      entity: sensor.suckist_cleaning_time
      name: Last took
    - type: tile
      entity: sensor.suckist_cleaning_area
      name: Last area
    - type: tile
      entity: sensor.suckist_total_cleaning_count
      name: Cleans ever
    - type: tile
      entity: sensor.suckist_total_cleaning_area
      name: Area ever
    - type: tile
      entity: sensor.suckist_total_cleaning_time
      name: Time ever
    - type: history-graph
      title: Battery · %
      hours_to_show: 48
      entities:
      - entity: sensor.suckist_battery
        name: Battery
  - type: grid
    cards:
    - type: heading
      heading: Settings
      icon: mdi:cog-outline
    - type: tile
      entity: switch.suckist_do_not_disturb
      name: Do not disturb
    - type: tile
      entity: time.suckist_do_not_disturb_begin
      name: Quiet from
    - type: tile
      entity: time.suckist_do_not_disturb_end
      name: Quiet until
    - type: tile
      entity: number.suckist_volume
      name: Voice volume
      grid_options: {columns: full}
      features_position: inline
      features:
      - type: numeric-input
        style: slider
    - type: tile
      entity: switch.suckist_dock_child_lock
      name: Child lock
