# Power and money. Batteries/backups are on System.
views:
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Power now
            icon: mdi:flash
          - {type: tile, entity: sensor.desk_power, name: Desk (PC + Mac mini), icon: mdi:desktop-tower-monitor}
          - {type: tile, entity: sensor.media_power, name: Home server, icon: mdi:server}
          - {type: tile, entity: sensor.fridge_power, name: Fridge, icon: mdi:fridge}
          - {type: tile, entity: sensor.piano_power, name: Piano, icon: mdi:piano}
          - type: history-graph
            title: Last 24 hours, W
            hours_to_show: 24
            entities:
              - {entity: sensor.desk_power, name: Desk}
              - {entity: sensor.media_power, name: Server}
              - {entity: sensor.fridge_power, name: Fridge}
      - type: grid
        cards:
          - type: heading
            heading: This bill
            icon: mdi:cash
            badges:
              - type: entity
                entity: sensor.electricity_maps_grid_fossil_fuel_percentage
                name: Grid fossil now
                icon: mdi:factory
          - {type: tile, entity: sensor.elec_account_3015750579_current_bill_electric_cost_to_date, name: Cost so far}
          - {type: tile, entity: sensor.elec_account_3015750579_current_bill_electric_forecasted_cost, name: Forecast}
          - {type: tile, entity: sensor.elec_account_3015750579_typical_monthly_electric_cost, name: Typical month}
          - {type: tile, entity: sensor.elec_account_3015750579_current_bill_electric_usage_to_date, name: kWh so far}
          - type: statistics-graph
            title: Daily use, kWh (PG&E is 1-2 days behind)
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types: [change]
            entities:
              - {entity: "opower:pge_elec_3015750579_energy_consumption", name: Whole house}
              - {entity: sensor.desk_energy, name: Desk}
              - {entity: sensor.media_energy, name: Server}
              - {entity: sensor.fridge_energy, name: Fridge}
          - type: button
            name: Full energy dashboard
            icon: mdi:chart-areaspline
            tap_action: {action: navigate, navigation_path: /energy}
