# Energy: our copy of HA's built-in Energy dashboard (which can only hide its own cards, not take new ones), with
# the cards we use plus one chart of kWh and cost. The energy-* cards read the sources and devices from Settings →
# Dashboards → Energy and, like the custom chart, follow the date picker in the footer. PG&E (opower) data arrives
# about a day late, so today has plugs but no meter yet. No distribution card: on the default range (today) it
# showed the plugs with no grid, and with no solar or battery it adds nothing to the chart above.
views:
- title: Energy
  path: energy
  icon: mdi:lightning-bolt
  type: sections
  max_columns: 3
  footer:
    card:
      type: energy-date-selection
      opening_direction: right
      vertical_opening_direction: up
  sections:
  - type: grid
    column_span: 3
    cards:
    # Plugs stacked with the meter's remainder as Untracked (kWh, left) and PG&E's cost (line, $ right), following
    # the date picker; www/energy-cost-card.js.
    - type: custom:energy-cost-card
      title: Electricity
      grid_options: {columns: full}
  # Two columns: in one, the table's Energy and Cost columns were cut off.
  - type: grid
    column_span: 2
    cards:
    - type: energy-sources-table
      title: Sources
      grid_options: {columns: full}
  - type: grid
    cards:
    - type: energy-sankey
      title: Energy flow
      grid_options: {columns: full}
