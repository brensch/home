# Per-room detail: individual bulbs and every Hue scene. Each room's on/off is
# in its heading (the room tiles themselves live on Home).
views:
  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
            badges:
              - {type: entity, entity: light.living_room_all, show_state: true, tap_action: {action: toggle}}
          - {type: tile, entity: light.tv_left, name: TV left, features_position: bottom, features: [{type: light-brightness}]}
          - {type: tile, entity: light.tv_right, name: TV right, features_position: bottom, features: [{type: light-brightness}]}
          - {type: tile, entity: light.hektar, name: Hektar, features_position: bottom, features: [{type: light-brightness}]}
          - {type: tile, entity: light.shelf, name: Shelf, features_position: bottom, features: [{type: light-brightness}]}
          - {type: tile, entity: light.lines_desk, name: Lines desk, features_position: bottom, features: [{type: light-brightness}]}
          - {type: tile, entity: light.tree, name: Tree}
          - {type: tile, entity: light.garland, name: Garland}
          - type: entities
            title: Scenes
            state_color: false
            entities:
              - scene.living_room_bright
              - scene.living_room_read
              - scene.living_room_concentrate
              - scene.living_room_energize
              - scene.living_room_relax
              - scene.living_room_dimmed
              - scene.living_room_nightlight
              - scene.living_room_savanna_sunset
              - scene.living_room_tropical_twilight
              - scene.living_room_arctic_aurora
              - scene.living_room_spring_blossom
              - scene.living_room_honolulu
              - scene.living_room_malibu_pink
              - scene.living_room_color_burst
              - scene.living_room_jolly
              - scene.living_room_spooky
              - scene.tv_honolulu
              - scene.tv_savanna_sunset
      - type: grid
        cards:
          - type: heading
            heading: Kitchen
            icon: mdi:countertop
            badges:
              - {type: entity, entity: light.kitchen_all, show_state: true, tap_action: {action: toggle}}
          - {type: tile, entity: light.kitchen_1, name: Ceiling 1}
          - {type: tile, entity: light.kitchen_2, name: Ceiling 2}
          - {type: tile, entity: light.kitchen_3, name: Ceiling 3}
          - {type: tile, entity: light.kitchen_4, name: Ceiling 4}
          - {type: tile, entity: light.fan_front, name: Table light}
          - {type: tile, entity: light.fan_back, name: Fan back}
          - {type: tile, entity: light.kitchen_uplight, name: Uplight}
          - {type: tile, entity: light.lines_kitchen, name: Lines kitchen}
          - {type: tile, entity: light.brightboy1, name: Brightboy}
          - {type: tile, entity: switch.piano_relay, name: Piano, icon: mdi:piano}
          - type: entities
            title: Scenes
            state_color: false
            entities:
              - scene.kitchen_bright
              - scene.kitchen_read
              - scene.kitchen_concentrate
              - scene.kitchen_energize
              - scene.kitchen_relax
              - scene.kitchen_dimmed
              - scene.kitchen_nightlight
              - scene.kitchen_savanna_sunset
              - scene.kitchen_tropical_twilight
              - scene.kitchen_arctic_aurora
              - scene.kitchen_spring_blossom
      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
            badges:
              - {type: entity, entity: light.bedroom, show_state: true, tap_action: {action: toggle}}
          - {type: tile, entity: light.brendside, name: Brend's side}
          - {type: tile, entity: light.gril_bedside, name: Alyssa's side}
          - {type: tile, entity: light.fado, name: Fado}
          - {type: tile, entity: light.fily, name: Fily}
          - {type: tile, entity: light.uplight, name: Uplight}
          - type: entities
            title: Scenes
            state_color: false
            entities:
              - scene.bedroom_bright
              - scene.bedroom_read
              - scene.bedroom_concentrate
              - scene.bedroom_energize
              - scene.bedroom_relax
              - scene.bedroom_cool
              - scene.bedroom_dimmed
              - scene.bedroom_nightlight
              - scene.bedroom_savanna_sunset
              - scene.bedroom_tropical_twilight
              - scene.bedroom_arctic_aurora
              - scene.bedroom_spring_blossom
          - type: heading
            heading: Balcony & closet
            heading_style: subtitle
            icon: mdi:door
          - {type: tile, entity: light.balcony, name: Balcony}
          - {type: tile, entity: light.closet, name: Closet}
          - {type: tile, entity: sensor.closet_temperature, name: Closet temp}
          - {type: tile, entity: binary_sensor.closet_motion, name: Closet motion}
          - type: entities
            state_color: false
            entities:
              - scene.balcony_bright
              - scene.balcony_dimmed
              - scene.closet_bright
              - scene.closet_dimmed
              - scene.closet_nightlight
