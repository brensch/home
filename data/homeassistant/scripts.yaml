############################################################
# Script: Turn kitchen light off after 60 seconds (manual) #
############################################################
# Call script.kitchen_light_delayed_off to turn the kitchen light off after 60s.
# Replace light.kitchen with the correct entity_id if needed.

kitchen_light_delayed_off:
  alias: Kitchen light delayed off (60s)
  sequence:
    - delay: '00:01:00'
    - service: light.turn_off
      target:
        entity_id: light.kitchen
  mode: restart

# Show a colour on some lights once, then put every bulb back exactly as it was.
# Groups (YAML light groups and Hue rooms) are expanded to their bulbs first, so
# the restore keeps each bulb's own state instead of the room's average. Only
# colour-capable bulbs that are online take part; white-only bulbs are left alone.
# Queued: overlapping calls take turns, so one flash never snapshots another's colour.
flash_lights:
  alias: Flash lights
  mode: queued
  fields:
    lights:
      description: Lights or light groups to flash.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    color:
      description: RGB colour to show.
      required: true
      selector:
        color_rgb: {}
    hold:
      description: Seconds to hold the colour before restoring.
      default: 2
      selector:
        number:
          min: 1
          max: 30
  sequence:
    - variables:
        bulbs: >
          {% set ns = namespace(out=[]) %}
          {% for l in expand(lights) %}
            {% set members = state_attr(l.entity_id, 'entity_id') %}
            {% for b in (members | list if members else [l.entity_id]) %}
              {% set modes = state_attr(b, 'supported_color_modes') or [] %}
              {% if has_value(b) and modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list %}
                {% set ns.out = ns.out + [b] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.out | unique | list }}
    - condition: "{{ bulbs | count > 0 }}"
    - variables:
        was_off: "{{ bulbs | select('is_state', 'off') | list }}"
        was_on: "{{ bulbs | reject('in', was_off) | list }}"
    # Lights that are on: remember them, then fade to black.
    - if:
      - "{{ was_on | count > 0 }}"
      then:
      - action: scene.create
        data:
          scene_id: flash_lights_before
          snapshot_entities: "{{ was_on }}"
      - action: light.turn_off
        target:
          entity_id: "{{ was_on }}"
        data:
          transition: 1
      - delay: 1
    # Fade up to the colour, hold, fade to black.
    - action: light.turn_on
      target:
        entity_id: "{{ bulbs }}"
      data:
        rgb_color: "{{ color }}"
        brightness_pct: 100
        transition: 1
    - delay:
        seconds: "{{ 1 + hold | default(2) | int }}"
    - action: light.turn_off
      target:
        entity_id: "{{ bulbs }}"
      data:
        transition: 1
    - delay: 1
    # Lights that were on fade back up to exactly how they were.
    - if:
      - "{{ was_on | count > 0 }}"
      then:
      - action: scene.turn_on
        target:
          entity_id: scene.flash_lights_before
        data:
          transition: 1
    # Lights that were off stay off. They now remember the flash colour, so mark
    # them; "Restore look after a flash" puts their own look back the next time
    # they're turned on.
    - if:
      - "{{ was_off | count > 0 }}"
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.flash_pending
        data:
          value: >
            {{ (states('input_text.flash_pending').split(',') | select | list + was_off) | unique | join(',') }}
