############################################################
# Script: Turn kitchen light off after 60 seconds (manual) #
############################################################
# Call script.kitchen_light_delayed_off to turn the kitchen light off after 60s.
# Replace light.kitchen with the correct entity_id if needed.

kitchen_light_delayed_off:
  alias: Kitchen light delayed off (60s)
  sequence:
    - delay: '00:01:00'
    - service: light.turn_off
      target:
        entity_id: light.kitchen
  mode: restart

# Show a colour on some lights once, then put every bulb back exactly as it was.
# Groups (YAML light groups and Hue rooms) are expanded to their bulbs first, so
# the restore keeps each bulb's own state instead of the room's average. Only
# colour-capable bulbs that are online take part; white-only bulbs are left alone.
# Queued: overlapping calls take turns, so one flash never snapshots another's colour.
flash_lights:
  alias: Flash lights
  mode: queued
  fields:
    lights:
      description: Lights or light groups to flash.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    color:
      description: RGB colour to show.
      required: true
      selector:
        color_rgb: {}
    hold:
      description: Seconds to hold the colour before restoring.
      default: 2
      selector:
        number:
          min: 1
          max: 30
  sequence:
    - variables:
        bulbs: >
          {% set ns = namespace(out=[]) %}
          {% for l in expand(lights) %}
            {% set members = state_attr(l.entity_id, 'entity_id') %}
            {% for b in (members | list if members else [l.entity_id]) %}
              {% set modes = state_attr(b, 'supported_color_modes') or [] %}
              {% if has_value(b) and modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list %}
                {% set ns.out = ns.out + [b] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.out | unique | list }}
    - condition: "{{ bulbs | count > 0 }}"
    # Save each bulb's true state from the device (colour and brightness, and
    # for lights that are off, what they'll come back on as).
    - action: shell_command.light_memory
      data:
        args: "save flash {{ bulbs | join(' ') }}"
      response_variable: saved
    - condition: "{{ saved.returncode == 0 }}"
    # Fade to black, up to the colour, hold, back to black. The fades to black
    # go straight to the devices: HA's Hue integration pins the brightness of a
    # bulb it fades off and forces it on the next plain turn-on.
    - action: shell_command.light_memory
      data:
        args: "off {{ bulbs | join(' ') }} --fade 1"
    - delay: 1
    - action: light.turn_on
      target:
        entity_id: "{{ bulbs }}"
      data:
        rgb_color: "{{ color }}"
        brightness_pct: 100
        transition: 1
    - delay:
        seconds: "{{ 1 + hold | default(2) | int }}"
    - action: shell_command.light_memory
      data:
        args: "off {{ bulbs | join(' ') }} --fade 1"
    - delay: 1
    # Put every bulb back as saved: lights that were on fade up to it, lights
    # that were off get their colour back while staying off.
    - action: shell_command.light_memory
      data:
        args: "restore flash --fade 1"
      response_variable: restored
    - if:
      - "{{ restored.returncode != 0 }}"
      then:
      - action: system_log.write
        data:
          level: error
          logger: script.flash_lights
          message: "light_memory restore: {{ restored.stderr }}"
    # The restore fades run on the devices after the command returns. Wait them
    # out so a queued flash (two arrivals at once) saves settled lights, not
    # half-faded ones.
    - delay: 1.5
