
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Recorder. The four CSE7766 smart plugs used to report power+voltage every
# second, which was 97% of all state rows (5.3M of 5.4M) and ~10 GB/day of
# SSD writes. The real fix is on-device averaging (see data/esphome/*.yaml);
# this block is the second line of defence.
#   - commit_interval batches writes instead of fsyncing every second.
#   - auto_purge/purge_keep_days are the defaults, stated explicitly so the
#     retention window is visible rather than implied.
# No exclude: block on purpose — the *_energy / *_energy_cost sensors feed the
# Energy dashboard's long-term statistics, and excluding an entity from the
# recorder also stops its statistics being generated.
recorder:
  auto_purge: true
  purge_keep_days: 10
  commit_interval: 30

# Disable TTS to prevent Google Cloud errors
tts:

# HTTP / Reverse Proxy Settings
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.18.0.0/16  # docker home_default network
    - 127.0.0.1
  ip_ban_enabled: true
  login_attempts_threshold: 5

google_assistant:
  project_id: passenger-princess-protector
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true # This allows syncing the state with Google Home
  expose_by_default: true # Temporarily expose all entities to test
  exposed_domains:
    - switch
    - light
    - camera
homeassistant:
  external_url: https://hass.brensch.com
  internal_url: http://192.168.1.37:8123

# Mutex so simultaneous arrivals flash one-at-a-time, and each snapshots the
# real prior light state rather than the other person's flash colour.
input_boolean:
  arrival_flash_lock:
    name: Arrival flash lock

# Combined room light groups: Hue room + Nanoleaf/WLED, so one tile
# controls every light in the room (not just the Hue bulbs). Defined in
# YAML (tracked in git) so they survive restarts/migrations — previously
# these were orphaned entity-registry entries with no backing definition.
light:
  - platform: group
    name: Kitchen All
    unique_id: kitchen_all_lights
    entities:
      - light.kitchen
      - light.lines_kitchen
      - light.brightboy1
  - platform: group
    name: Living Room All
    unique_id: living_room_all_lights
    entities:
      - light.living_room
      - light.lines_desk
      - light.tree
      - light.garland
