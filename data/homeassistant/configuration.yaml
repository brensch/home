
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Recorder. The four CSE7766 smart plugs used to report power+voltage every
# second, which was 97% of all state rows (5.3M of 5.4M) and ~10 GB/day of
# SSD writes. The real fix is on-device averaging (see data/esphome/*.yaml);
# this block is the second line of defence.
#   - commit_interval batches writes instead of fsyncing every second.
# Exclude only what's copied at a slower rate: excluding an entity also stops
# its long-term statistics (the *_energy / *_energy_cost sensors feed the
# Energy dashboard's, so never exclude those).
recorder:
  auto_purge: true
  # Everything is kept (10 years), since the 2026-10-18 audit cut the noise: ~2-2.5 GB a year at that day's rate.
  # Watch for a new chatty entity (the audit found UniFi and the plant photos at ~70% of rows). Local HA backups
  # are kept at 3 copies (each holds the whole database; the server's disk is the limit, Drive has 5 TB).
  purge_keep_days: 3650
  commit_interval: 30
  # 2026-10-18 audit. Images have no use for history, and the plant photos (MQTT, from ~/plants) are re-published
  # every 30 s: ~11k rows a day for five pictures. The router's temperature and CPU arrive every few seconds
  # (~50k rows a day); their once-a-minute copies (sensor.router_temperature / router_cpu) are what's recorded.
  # Router traffic, memory, latency and per-device bandwidth aren't in HA at all: UniFi's own app has them.
  # 2026-10-19: images (all of them: their picture token changes every 5 minutes, so even an unavailable one adds
  # a row each time, and a picture's history is no use; the 14 Steam Online game pictures alone were ~4k rows a
  # day). The recorder can't drop just the "unavailable" rows, so the TV's entities stay recorded, blips and all.
  exclude:
    entity_globs:
      - image.*
    entities:
      # OPF heartbeat updates every poll; actual charger transitions stay recorded.
      - sensor.opf_last_checked
      - sensor.schrouter_cpu_temperature
      - sensor.schrouter_cpu_utilization

# Disable TTS to prevent Google Cloud errors
tts:

# HTTP / Reverse Proxy Settings
# http: was migrated into .storage/http (2026-10-05) and is managed under Settings > System > Network now:
# X-Forwarded-For on, trusted proxies 172.18.0.0/16 (home_default, i.e. Caddy) and 127.0.0.1, IP bans after 20 tries.

homeassistant:
  unit_system: metric
  external_url: https://hass.brensch.com
  internal_url: http://192.168.1.8:8123

# Combined room light groups: Hue room + Nanoleaf/WLED, so one tile
# controls every light in the room (not just the Hue bulbs). Defined in
# YAML (tracked in git) so they survive restarts/migrations — previously
# these were orphaned entity-registry entries with no backing definition.
light:
  - platform: group
    name: Kitchen All
    unique_id: kitchen_all_lights
    entities:
      - light.kitchen
      - light.lines_kitchen
      - light.brightboy1
  - platform: group
    name: Living Room All
    unique_id: living_room_all_lights
    entities:
      - light.living_room
      - light.lines_desk
      - light.tree
      - light.garland

# Last time the server was alive, stamped every 5 minutes by the "Downtime
# report" automation. HA restores it after a restart, so on boot the gap
# between it and now is how long the server (usually: the power) was out.
input_datetime:
  server_heartbeat:
    name: Server heartbeat
    has_date: true
    has_time: true

# Saves lights' real state from the devices and writes it back, including a
# colour for a light that stays off (HA's light services can't do that). Used by
# script.flash_lights; see tools/light_memory.py and its tests.
shell_command:
  light_memory: "python3 /config/tools/light_memory.py {{ args }}"

# Dashboards defined as YAML in git (dashboards/), one job each:
#   Home = daily command center (default);
#   TV = what's been on and for how long (www/tv-card.js);
#   Places = where each of us has been: a pie and a timeline per person, kept forever;
#   Garage = the Tesla: controls, where it is, home charging and battery;
#   Energy = our copy of the built-in Energy dashboard (that one can't take new
#   cards) with one kWh + cost chart (www/energy-cost-card.js); the built-in
#   panel is hidden from everyone's sidebar (frontend/update_panel, url_path
#   energy, show_in_sidebar false; stored by HA, not in this file);
#   Plants = the balcony plants (~/plants), generated by www/plants-strategy.js.
# The old storage Overview is hidden.
lovelace:
  # Frontend modules, in YAML so they live in git. Bump ?v= after changing a file, or browsers keep the old one.
  resource_mode: yaml
  resources:
    - url: /local/temperature-badge.js?v=2
      type: module
    - url: /local/plants-strategy.js?v=23
      type: module
    - url: /local/energy-cost-card.js?v=8
      type: module
    - url: /local/presence-card.js?v=9
      type: module
    - url: /local/tv-card.js?v=3
      type: module
  dashboards:
    plants-dash:
      mode: yaml
      title: Plants
      icon: mdi:sprout
      show_in_sidebar: true
      filename: dashboards/plants.yaml
    home-dash:
      mode: yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/home.yaml
    health-dash:
      mode: yaml
      title: Health
      icon: mdi:heart-pulse
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/health.yaml
    network-dash:
      mode: yaml
      title: Network
      icon: mdi:router-wireless
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/network.yaml
    camera-dash:
      mode: yaml
      title: Camera
      icon: mdi:cctv
      show_in_sidebar: true
      filename: dashboards/camera.yaml
    vacuum-dash:
      mode: yaml
      title: Vacuum
      icon: mdi:robot-vacuum
      show_in_sidebar: true
      filename: dashboards/vacuum.yaml
    tv-dash:
      mode: yaml
      title: TV
      icon: mdi:television-classic
      show_in_sidebar: true
      filename: dashboards/tv.yaml
    places-dash:
      mode: yaml
      title: Places
      icon: mdi:map-marker-radius
      show_in_sidebar: true
      filename: dashboards/places.yaml
    garage-dash:
      mode: yaml
      title: Garage
      icon: mdi:garage
      show_in_sidebar: true
      filename: dashboards/garage.yaml
    energy-dash:
      mode: yaml
      title: Energy
      icon: mdi:lightning-bolt
      show_in_sidebar: true
      filename: dashboards/energy.yaml

# On while movie mode has the living room dimmed; its pre-film look is saved on
# the devices by light_memory (survives restarts, unlike scene.create).
input_boolean:
  opf_watch:
    name: Watch for a charger
    icon: mdi:ev-station
  opf_arrival_armed:
    name: OPF arrival alert armed
    icon: mdi:ev-station
  movie_dimmed:
    name: Movie mode has the living room dimmed
    icon: mdi:movie-open
  # Lets Suckist clean on its own every 3 days (automation suckist_auto_clean); the Vacuum page's one switch.
  suckist_auto:
    name: Auto-clean
    icon: mdi:robot-vacuum
  # The Vacuum page's "Mop as well" for its Clean now buttons (script.suckist_clean_rooms sets the robot's mode from it).
  suckist_adhoc_mop:
    name: Mop as well
    icon: mdi:water

# What Suckist's automatic cleans use (automation suckist_auto_clean sets them on the robot before it starts).
input_select:
  suckist_auto_mode:
    name: Auto-clean mode
    icon: mdi:spray-bottle
    options: [Vacuum and mop, Vacuum only, Mop only]
  suckist_auto_suction:
    name: Auto-clean suction
    icon: mdi:fan
    options: [Quiet, Balanced, Turbo, Max, Max+]
  suckist_auto_water:
    name: Auto-clean mop water
    icon: mdi:water-outline
    options: [Low, Medium, High]
  suckist_auto_route:
    name: Auto-clean mop route
    icon: mdi:vector-polyline
    options: [Fast, Standard, Deep, Deep+]

# kWh the car has drawn charging at home, for the Garage page (not an Energy dashboard device: the car belongs on
# Garage; on Energy its charging stays inside Untracked).
sensor:
  # OPF app's read-only site-status requests; refresh token is private runtime state.
  - platform: opf_status
    session_file: /config/.storage/opf_status_session.json
  - platform: integration
    name: Schlesla home charging energy
    unique_id: schlesla_home_charging_energy
    source: sensor.schlesla_home_charging_power
    method: left
    round: 3
    max_sub_interval:
      minutes: 15

# This month's home charging, and what it cost at PG&E's off-peak rate (28.6¢/kWh, E-TOU-C as seen in the
# opower data 2026-10; peak 4-9 pm is 31.6¢), for the Garage page.
utility_meter:
  schlesla_home_charging_month:
    name: Schlesla home charging this month
    unique_id: schlesla_home_charging_month
    source: sensor.schlesla_home_charging_energy
    cycle: monthly

# Internet reachability is separate from the router's controller connection.
binary_sensor:
  - platform: rest
    name: Internet connection
    unique_id: unifi_primary_wan_internet_connection
    device_class: connectivity
    resource: https://192.168.1.1/proxy/network/api/s/default/stat/health
    verify_ssl: false
    scan_interval: 30
    timeout: 10
    headers:
      X-API-KEY: !secret unifi_network_api_key
    value_template: >-
      {% set health = value_json.get('data', []) %}
      {% set wan = health | selectattr('subsystem', 'equalto', 'wan') | list %}
      {% set internet = health | selectattr('subsystem', 'equalto', 'www') | list %}
      {{ value_json.get('meta', {}).get('rc') == 'ok'
         and wan | length > 0 and internet | length > 0
         and wan[0].get('status') == 'ok'
         and internet[0].get('status') == 'ok' }}

# Frigate (the NVR) reaches Home Assistant over MQTT, read by Home Assistant's own MQTT integration: no Frigate plugin.
mqtt: !include mqtt.yaml

# The face Frigate saw in a person's last visit, for the balcony person alert. Frigate cuts out every face it reads
# and keeps it (clips/faces/train, the Face Library's Train tab), announcing each read on MQTT without the file, so
# this asks its API (port 5000, inside the docker network only, no login) which of that visit's crops scored best.
# Frigate only reads faces once the Face Library holds at least one face.
rest_command:
  frigate_faces:
    url: http://frigate:5000/api/faces
  # Driving time from a point to home, from OpenStreetMap's public OSRM router (no key; no live traffic). Waze,
  # HA's usual travel-time integration, answered 403 Forbidden from this server (2026-10-18).
  drive_home:
    url: >-
      https://router.project-osrm.org/route/v1/driving/{{ lon }},{{ lat }};{{ state_attr('zone.home', 'longitude') }},{{ state_attr('zone.home', 'latitude') }}?overview=false
    timeout: 15

template:
  - triggers:
      - trigger: mqtt
        topic: frigate/tracked_object_update
    conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.type == 'face' and trigger.payload_json.camera == 'balcony' }}"
    actions:
      - action: rest_command.frigate_faces
        response_variable: faces
      # Crops are named <event>-<time>-<name>-<score>.webp; the best of this visit's.
      - variables:
          file: >-
            {% set ns = namespace(best='', score=-1) %}
            {% for f in (faces.content.train if faces.content is mapping else []) | default([], true)
                 if f.startswith(trigger.payload_json.id ~ '-') %}
              {% set s = f[:-5].split('-')[-1] | float(0) %}
              {% if s > ns.score %}{% set ns.best = f %}{% set ns.score = s %}{% endif %}
            {% endfor %}{{ ns.best }}
    sensor:
      - name: Balcony last face
        unique_id: frigate_balcony_last_face
        icon: mdi:face-recognition
        state: "{{ file if file else this.state }}"
        attributes:
          event: "{{ trigger.payload_json.id }}"
          name: "{{ trigger.payload_json.name }}"
          score: "{{ trigger.payload_json.score }}"
  # When the fridge last defrosted (its ~430 W heater, 10-20 min every 3-4 days; a compressor start's surge lasts
  # seconds). The cooling cycle after a defrost runs hot for up to ~40 min, so the watchdog's quick 95 W rule skips it.
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.fridge_power
        above: 300
        for: 00:03:00
    sensor:
      - name: Fridge last defrost
        unique_id: fridge_last_defrost
        device_class: timestamp
        icon: mdi:snowflake-melt
        state: "{{ now().isoformat() }}"
  # Suckist (Roborock): how long since it last finished a clean (the robot's own record, so manual runs
  # count too), for the Vacuum page and auto-clean.
  - sensor:
      - name: Suckist days since clean
        unique_id: suckist_days_since_clean
        unit_of_measurement: days
        icon: mdi:calendar-refresh
        availability: "{{ as_datetime(states('sensor.suckist_last_clean_end')) is not none }}"
        state: "{{ ((now() - as_datetime(states('sensor.suckist_last_clean_end'))).total_seconds() / 86400) | round(1) }}"
  # Suckist's cleans one by one, from the robot's figures for its last clean (they settle a minute after it ends).
  # They read the clean's value for an hour after it and 0 otherwise, so their daily max (the Vacuum page's bar
  # charts) is one bar per clean day, and every other day has a 0 that keeps the chart's days evenly spaced.
  - triggers:
      - trigger: state
        entity_id: sensor.suckist_last_clean_end
        not_to: [unknown, unavailable]
        for: 00:02:00
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: 5
    actions:
      - variables:
          fresh: >-
            {% set ended = as_datetime(states('sensor.suckist_last_clean_end')) %}
            {{ ended is not none and now() - ended < timedelta(hours=1) }}
          entry: >-
            {{ {'minutes': states('sensor.suckist_cleaning_time') | float(0) | round(0) | int,
                'area': states('sensor.suckist_cleaning_area') | float(0) | round(1)} }}
    sensor:
      - name: Suckist clean minutes
        unique_id: suckist_clean_minutes
        icon: mdi:timer-outline
        unit_of_measurement: min
        state_class: measurement
        state: "{{ entry.minutes if fresh else 0 }}"
      - name: Suckist clean area
        unique_id: suckist_clean_area
        icon: mdi:texture-box
        unit_of_measurement: m²
        state_class: measurement
        state: "{{ entry.area if fresh else 0 }}"
  # The TV's power for the dashboards, ignoring the second-long drops: in standby it loses both its connections
  # (Android TV Remote and Cast) every few minutes and they come straight back. Unavailable only after a minute.
  - triggers:
      - trigger: state
        entity_id: media_player.tv
        not_to: unavailable
      - trigger: state
        entity_id: media_player.tv
        to: unavailable
        for: 00:01:00
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: TV
        unique_id: tv_power
        icon: "{{ 'mdi:television' if is_state('media_player.tv', 'on') else 'mdi:television-off' }}"
        # Only re-rendered by the triggers above, so a drop shows here only once it has lasted a minute.
        availability: "{{ not is_state('media_player.tv', 'unavailable') }}"
        state: "{{ 'On' if is_state('media_player.tv', 'on') else 'Off' }}"
  # The Tesla (Schlesla, Tesla Fleet integration) charging at home, for the Energy page: its charger power while
  # it's parked at home, else 0. Integrated into sensor.schlesla_home_charging_energy below. The car is read every
  # 10 minutes, so this is a step per reading.
  - sensor:
      - name: Schlesla home charging power
        unique_id: schlesla_home_charging_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:ev-station
        availability: "{{ has_value('sensor.schlesla_charger_power') }}"
        state: >-
          {{ states('sensor.schlesla_charger_power') | float(0)
             if is_state('device_tracker.schlesla_location', 'home') else 0 }}
  - sensor:
      - name: Schlesla home charging cost this month
        unique_id: schlesla_home_charging_cost_month
        unit_of_measurement: USD
        device_class: monetary
        icon: mdi:cash
        availability: "{{ has_value('sensor.schlesla_home_charging_this_month') }}"
        state: "{{ (states('sensor.schlesla_home_charging_this_month') | float(0) * 0.286) | round(2) }}"
  # The router's temperature and CPU once a minute (the originals update every few seconds and aren't recorded).
  - triggers:
      - trigger: time_pattern
        minutes: /1
    sensor:
      - name: Router temperature
        unique_id: router_temperature
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        availability: "{{ has_value('sensor.schrouter_cpu_temperature') }}"
        state: "{{ states('sensor.schrouter_cpu_temperature') }}"
      - name: Router CPU
        unique_id: router_cpu
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:cpu-64-bit
        availability: "{{ has_value('sensor.schrouter_cpu_utilization') }}"
        state: "{{ states('sensor.schrouter_cpu_utilization') }}"
  # Where each of us is, as numbers so it's kept forever: 100 while in that place, else 0. Long-term statistics keep
  # each hour's average (= % of the hour there) indefinitely; the Places page's pie and timeline
  # (www/presence-card.js) read those. Away = in none of the zones. Backfilled 2026-10-18 from the 10 days of history.
  - sensor:
      - name: Brendan at Home
        unique_id: presence_brendan_home
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.brend') }}"
        state: "{{ 100 if (is_state('person.brend', 'home')) else 0 }}"
      - name: Brendan at Brendan's work
        unique_id: presence_brendan_work
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.brend') }}"
        state: "{{ 100 if (is_state('person.brend', state_attr('zone.work', 'friendly_name'))) else 0 }}"
      - name: Brendan at Gym
        unique_id: presence_brendan_gym
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.brend') }}"
        state: "{{ 100 if (is_state('person.brend', state_attr('zone.gym', 'friendly_name'))) else 0 }}"
      - name: Brendan at Alyssa's parents
        unique_id: presence_brendan_parents
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.brend') }}"
        state: "{{ 100 if (is_state('person.brend', state_attr('zone.alyssa_s_parents', 'friendly_name'))) else 0 }}"
      - name: Brendan at Away
        unique_id: presence_brendan_away
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.brend') }}"
        state: "{{ 100 if (is_state('person.brend', 'not_home')) else 0 }}"
      - name: Alyssa at Home
        unique_id: presence_alyssa_home
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.alyssa') }}"
        state: "{{ 100 if (is_state('person.alyssa', 'home')) else 0 }}"
      - name: Alyssa at Gym
        unique_id: presence_alyssa_gym
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.alyssa') }}"
        state: "{{ 100 if (is_state('person.alyssa', state_attr('zone.gym', 'friendly_name'))) else 0 }}"
      - name: Alyssa at Alyssa's parents
        unique_id: presence_alyssa_parents
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.alyssa') }}"
        state: "{{ 100 if (is_state('person.alyssa', state_attr('zone.alyssa_s_parents', 'friendly_name'))) else 0 }}"
      - name: Alyssa at Away
        unique_id: presence_alyssa_away
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:map-marker
        availability: "{{ has_value('person.alyssa') }}"
        state: "{{ 100 if (is_state('person.alyssa', 'not_home')) else 0 }}"
  # Free space as a percentage, for the Health page and the disk alert (System Monitor reports usage % and free GiB).
  - sensor:
      - name: Server disk free percent
        unique_id: server_disk_free_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:harddisk
        availability: "{{ has_value('sensor.server_disk_usage') }}"
        state: "{{ (100 - states('sensor.server_disk_usage') | float) | round(1) }}"
        attributes:
          free: "{{ states('sensor.server_disk_free') }} GiB"
      - name: NVR disk free percent
        unique_id: server_nvr_disk_free_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:cctv
        availability: "{{ has_value('sensor.server_nvr_disk_usage') }}"
        state: "{{ (100 - states('sensor.server_nvr_disk_usage') | float) | round(1) }}"
        attributes:
          free: "{{ states('sensor.server_nvr_disk_free') }} GiB"
  - image:
      # The last person's whole visit, as Frigate's animated preview: its popup plays it.
      - name: Balcony last person clip
        unique_id: frigate_balcony_last_person_clip
        url: "http://frigate:5000/api/events/{{ state_attr('sensor.balcony_last_person', 'event') }}/preview.gif"
        availability: "{{ state_attr('sensor.balcony_last_person', 'event') is string }}"
      - name: Balcony last face
        unique_id: frigate_balcony_last_face_image
        url: "http://frigate:5000/clips/faces/train/{{ states('sensor.balcony_last_face') }}"

# The off-box backup to Google Drive (the "backup" container, config/backup/backup.sh) writes its result here after
# each daily run; the "Off-box backup" automation alerts when the last good run is over 2 days old.
command_line:
  - sensor:
      name: Offsite backup
      unique_id: offsite_backup
      command: "cat /config/offsite-backup/status.json"
      value_template: "{{ value_json.last_ok if value_json.last_ok else None }}"
      device_class: timestamp
      json_attributes: [last_run, failed, bytes]
      scan_interval: 600

# Camera live views go through Frigate's go2rtc (same version Home Assistant wants), not the one built into Home
# Assistant: that one, inside this container, offered browsers an address they couldn't reach, so every cold view
# waited for WebRTC to find another route. Frigate's publishes WebRTC at the server's LAN address.
go2rtc:
  url: http://frigate:1984/
