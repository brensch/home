name: homelab

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: homeassistant
    # Reach the host-networked matter-server at host.docker.internal:5580
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8123:8123"
    # Running as host user for easier file permission management
    user: "${UID}:${GID}"
    # privileged removed; add back if you need USB / network discovery that fails without it
    environment:
      - TZ=America/Los_Angeles  # PST
    volumes:
      - ./data/homeassistant:/config  # entire HA config; manage via UI
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - home_default
  # Caddy (reverse proxy) is optional and starts after HA

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"  # websockets (optional)
    user: "${UID}:${GID}"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - home_default

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_AGREE=true
      - DOMAIN=${DOMAIN}
      - ESPHOME_USERNAME=${ESPHOME_USERNAME}
      - ESPHOME_PASSWORD=${ESPHOME_PASSWORD}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/christmas-party:/srv/christmas-party
      # Built Hugo blog (brensch.com root) from the separate `blog` repo.
      - /home/brensch/blog/public:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homeassistant
    restart: unless-stopped
    networks:
      - home_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Keeps the zone's A records pointed at this house's public IP.
  #
  # Was oznu/cloudflare-ddns, which is unmaintained and verifies credentials
  # against /user/tokens/verify. Account-scoped tokens (the `cfat_` kind) only
  # verify at /accounts/{id}/tokens/verify, so oznu 401'd on a perfectly valid
  # token and crash-looped ~47k times over five weeks without ever updating DNS.
  #
  # DOMAINS covers the wildcard as well as the apex. hass.brensch.com resolves
  # via *.brensch.com, and the old SUBDOMAIN=@ config only ever touched the
  # apex — so even with working auth, remote access would have broken on the
  # next IP change.
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    # Only needs outbound HTTPS; host networking bought nothing.
    networks:
      - home_default
    user: "${UID}:${GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - "DOMAINS=${DOMAIN},*.${DOMAIN}"
      - IP4_PROVIDER=cloudflare.trace
      - IP6_PROVIDER=none
      - PROXIED=false
      - TTL=60          # matches the existing records; avoids a TTL-mismatch warning
      - "UPDATE_CRON=@every 5m"
      - DELETE_ON_STOP=false
      - TZ=America/Los_Angeles
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  esphome:
    image: esphome/esphome:latest
    container_name: esphome
    volumes:
      - ./data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Los_Angeles
      - PLATFORMIO_CORE_DIR=/config/.esphome/platformio
    ports:
      - "6052:6052"  # ESPHome dashboard
      - "6123:6123"  # OTA updates
    restart: unless-stopped
    networks:
      - home_default
    user: "${UID}:${GID}"

  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld
    restart: unless-stopped
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - PORT=8211
      - PLAYERS=16
      - MULTITHREADING=true
      - RCON_ENABLED=true
      - RCON_PORT=25575
      - TZ=America/Los_Angeles
      - COMMUNITY=true
      - SERVER_NAME=Nog Island
      - SERVER_PASSWORD=squirt
      - ENABLE_PLAYER_LOGGING=true
      - AUTO_PAUSE_ENABLED=true
      - ADMIN_PASSWORD=${PALWORLD_ADMIN_PASSWORD}
      - DIFFICULTY=Hard
      - PAL_EGG_DEFAULT_HATCHING_TIME=0.5
      - PUBLIC_IP=pal.${DOMAIN}
      - PUBLIC_PORT=8211
    volumes:
      - ./data/palworld:/palworld
    networks:
      - home_default

  # Matter Server: this is a HA Container install (no add-on store), so the
  # Matter integration needs an external Matter server to talk to. Host
  # networking is required — Matter relies on IPv6, mDNS and Thread/Wi-Fi
  # commissioning. HA connects to it at ws://host.docker.internal:5580/ws.
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./data/matter-server:/data
      - /run/dbus:/run/dbus:ro

volumes:
  caddy_data: {}
  caddy_config: {}

networks:
  home_default:
    external: true

